# 生产部署（NAS / 任意 Docker 主机）：只拉镜像，不构建
#
# 目录约定（本文件放在 /opt/meowmusic-docker/ 下使用）：
#   /opt/meowmusic-docker/docker-compose.yml   ← 本文件
#   /opt/meowmusic-docker/.env                 ← MUSIC_MP3API_KEY 等密钥
#   /opt/meowmusic-docker/data/files/          ← 歌单/用户/设备绑定/背景图
#   /opt/meowmusic-docker/data/cache/          ← 音频缓存
#   /opt/meowmusic-docker/data/devices.json    ← 设备绑定表
#
# 常用命令：
#   docker compose pull && docker compose up -d
#   docker compose logs -f
#
# 首次部署先建目录（devices.json 必须是文件，否则 docker 会把挂载点建成目录）：
#   mkdir -p data/files data/cache
#   [ -f data/devices.json ] || echo '{"devices":{}}' > data/devices.json
#
# 完整部署说明见同仓库 deploy/README.md（一页版）。
#
# 想换镜像/端口，改同目录 .env 里的 MEOW_IMAGE / MEOW_PORT 即可。

name: meowmusic

services:
  meow-music:
    image: ${MEOW_IMAGE:-joe1280/meowmusic:latest}
    container_name: meow-music
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${MEOW_PORT:-2233}:2233"
    environment:
      PORT: "2233"
      TZ: Asia/Shanghai
      PLAYLIST_SONGS_MAX: "${PLAYLIST_SONGS_MAX:-150}"
    env_file:
      - path: .env
        required: false
    volumes:
      - ${MEOW_DATA_DIR:-./data}/files:/app/files
      - ${MEOW_DATA_DIR:-./data}/cache:/app/cache
      - ${MEOW_DATA_DIR:-./data}/devices.json:/app/devices.json
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2233/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
