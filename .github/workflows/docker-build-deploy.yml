name: Build and Deploy Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      deploy:
        description: '构建完成后是否部署到 NAS'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_DOCKERHUB: joe1280/meowmusic
  IMAGE_GHCR: ghcr.io/joe12801/meowmusic
  # 阿里云个人版 ACR（公开仓库，拉取不需要登录；从国内机器拉比 Docker Hub 快且没有限流）
  IMAGE_ACR: crpi-wv2uaegt8g2y0g3c.cn-guangzhou.personal.cr.aliyuncs.com/joeloveqt-project/meowmusic
  ACR_REGISTRY: crpi-wv2uaegt8g2y0g3c.cn-guangzhou.personal.cr.aliyuncs.com
  # NAS 上的部署目录（存放 .env 与 data/，compose 文件由每次 checkout 提供）
  DEPLOY_DIR: /vol1/meowmusic/deploy

jobs:
  build:
    name: Build & Push (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 交叉构建)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 阿里云 ACR 只在国内用得上，secret 没配就跳过，不影响原有 Docker Hub / GHCR 流程
      - name: Login Aliyun ACR
        if: env.ACR_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_DOCKERHUB }}
            ${{ env.IMAGE_GHCR }}
            ${{ env.IMAGE_ACR }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=MeowMusicServer
            org.opencontainers.image.description=ESP32 小智音箱音乐服务端（多音源）

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy to NAS
    needs: build
    if: |
      always() && needs.build.result == 'success' &&
      (github.event_name == 'push' || inputs.deploy)
    runs-on: [self-hosted, nas]
    env:
      # 该 runner 的 joe1280 用户没有 home 目录，docker login 会 mkdir /home/joe1280 失败
      DOCKER_CONFIG: ${{ github.workspace }}/.docker
    steps:
      - name: Checkout (取 deploy/docker-compose.yml)
        uses: actions/checkout@v4

      - name: 记录当前镜像
        id: before
        run: |
          docker inspect -f '{{.Image}}' meow-music 2>/dev/null || echo "none"
          docker image inspect joe1280/meowmusic:latest \
            --format '当前 running 镜像: {{.Id}} ({{.Created}})' 2>/dev/null || true

      - name: Pull 最新镜像
        env:
          GH_TOKEN_FOR_GHCR: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          COMPOSE="docker compose -f $GITHUB_WORKSPACE/deploy/docker-compose.yml --project-directory $DEPLOY_DIR"

          # 依次尝试 ACR → Docker Hub → GHCR，每个源重试 3 次
          try_pull() {
            for i in 1 2 3; do
              echo "--- 尝试 $1（第 $i 次）---"
              if MEOW_IMAGE="$1" $COMPOSE pull; then
                echo "MEOW_IMAGE=$1" >> "$GITHUB_ENV"
                echo "✅ 拉取成功：$1"
                return 0
              fi
              sleep 5
            done
            return 1
          }

          if try_pull "$IMAGE_ACR:latest"; then exit 0; fi
          echo "⚠️ ACR 三次均失败，回落 Docker Hub"
          if try_pull "$IMAGE_DOCKERHUB:latest"; then exit 0; fi
          echo "⚠️ Docker Hub 也失败，回落 GHCR"
          echo "$GH_TOKEN_FOR_GHCR" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          try_pull "$IMAGE_GHCR:latest"

      - name: 重建容器
        run: |
          docker compose \
            -f "$GITHUB_WORKSPACE/deploy/docker-compose.yml" \
            --project-directory "$DEPLOY_DIR" \
            up -d --remove-orphans

      - name: 健康检查
        run: |
          set -e
          for i in $(seq 1 20); do
            if curl -fsS -m 3 http://127.0.0.1:2233/ > /dev/null; then
              echo "✅ 服务已就绪（第 ${i} 次探测）"
              curl -fsS -m 5 "http://127.0.0.1:2233/api/search?query=%E5%91%A8%E6%9D%B0%E4%BC%A6&limit=1" > /dev/null \
                && echo "✅ 搜索接口正常" || echo "⚠️ 搜索接口无响应（不影响启动）"
              docker image prune -f --filter "until=24h" > /dev/null 2>&1 || true
              exit 0
            fi
            sleep 3
          done
          echo "❌ 20 次探测仍不可用，输出容器日志："
          docker compose \
            -f "$GITHUB_WORKSPACE/deploy/docker-compose.yml" \
            --project-directory "$DEPLOY_DIR" \
            logs --tail 80
          exit 1

      - name: 部署后状态
        if: always()
        run: |
          docker ps --filter name=meow-music --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          echo "--- 磁盘 ---"
          df -h /vol1 | tail -1
