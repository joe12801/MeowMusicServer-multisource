# 只负责「构建 + 推镜像」。部署到 NAS 已拆到 deploy-nas.yml。
#
# 为什么要拆（2026-11-23）：原先 deploy job 的 if 是
#   (github.event_name == 'push' || inputs.deploy)
# 即每次 push 都会排一个 Deploy to NAS。NAS runner 离线时这个 job 会无限期
# 处于 queued，占住本 workflow 的 concurrency 组不放，导致之后每次 push 的 run
# 都卡在 pending 且 jobs 为空（concurrency.cancel-in-progress 只能取消正在跑的，
# 取消不了 queued 的 job）。拆成独立 workflow 后两边各用各的并发组，
# NAS 在不在线都不影响出新镜像。
name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_DOCKERHUB: joe1280/meowmusic
  IMAGE_GHCR: ghcr.io/joe12801/meowmusic
  # 阿里云个人版 ACR（公开仓库，拉取不需要登录；从国内机器拉比 Docker Hub 快且没有限流）
  IMAGE_ACR: crpi-wv2uaegt8g2y0g3c.cn-guangzhou.personal.cr.aliyuncs.com/joeloveqt-project/meowmusic
  ACR_REGISTRY: crpi-wv2uaegt8g2y0g3c.cn-guangzhou.personal.cr.aliyuncs.com

jobs:
  build:
    name: Build & Push (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 交叉构建)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 阿里云 ACR 只在国内用得上，secret 没配就跳过，不影响原有 Docker Hub / GHCR 流程
      - name: Login Aliyun ACR
        if: env.ACR_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_DOCKERHUB }}
            ${{ env.IMAGE_GHCR }}
            ${{ env.IMAGE_ACR }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=MeowMusicServer
            org.opencontainers.image.description=ESP32 小智音箱音乐服务端（多音源）

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
