# 部署到国内 NAS（self-hosted runner，label: nas）
#
# 从 docker-build-deploy.yml 拆出来，原因见那个文件顶部的注释：
# 部署需要一台可能离线的机器，不该和「出镜像」共用并发组。
#
# 触发方式：只有手动（Actions → Deploy to NAS → Run workflow）。
# NAS 关机 / runner 没起来时不会有人替你排队，也不会拖累构建。
#
# 想恢复「push 后自动部署」的话，把下面的注释块加回来即可 ——
# 注意 workflow_run 触发的 run 里 GITHUB_SHA 是默认分支最新提交、
# 不是触发它的那个 commit，checkout 必须显式用 head_sha，
# 否则部署用的 compose 文件可能和镜像版本对不上。
#
# on:
#   workflow_run:
#     workflows: ["Build and Push Docker Image"]
#     types: [completed]
#     branches: [main]

name: Deploy to NAS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '要部署的镜像 tag（latest / sha-xxxxxxx）'
        type: string
        default: latest
        required: true

# 独立并发组：和构建互不影响。连续手动触发时排队而不是互相取消，
# 避免「容器重建到一半被掐掉」。
concurrency:
  group: deploy-nas
  cancel-in-progress: false

env:
  IMAGE_DOCKERHUB: joe1280/meowmusic
  IMAGE_GHCR: ghcr.io/joe12801/meowmusic
  # 阿里云个人版 ACR（公开仓库，拉取不需要登录；国内拉取比 Docker Hub 快且不限流）
  IMAGE_ACR: crpi-wv2uaegt8g2y0g3c.cn-guangzhou.personal.cr.aliyuncs.com/joeloveqt-project/meowmusic
  ACR_REGISTRY: crpi-wv2uaegt8g2y0g3c.cn-guangzhou.personal.cr.aliyuncs.com
  # NAS 上的部署目录（存放 .env 与 data/，compose 文件由每次 checkout 提供）
  DEPLOY_DIR: /vol1/meowmusic/deploy

jobs:
  deploy:
    name: Deploy to NAS
    runs-on: [self-hosted, nas]
    timeout-minutes: 30
    env:
      # 该 runner 的 joe1280 用户没有 home 目录，docker login 会 mkdir /home/joe1280 失败
      DOCKER_CONFIG: ${{ github.workspace }}/.docker
      TAG: ${{ inputs.image_tag }}
    steps:
      - name: Checkout (取 deploy/docker-compose.yml)
        uses: actions/checkout@v4

      - name: 记录当前镜像
        run: |
          echo "将要部署的 tag: $TAG"
          docker inspect -f '{{.Image}}' meow-music 2>/dev/null || echo "none"
          docker image inspect joe1280/meowmusic:latest \
            --format '当前 running 镜像: {{.Id}} ({{.Created}})' 2>/dev/null || true

      - name: Pull 镜像
        env:
          GH_TOKEN_FOR_GHCR: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -z "$TAG" ]; then echo "❌ image_tag 为空"; exit 1; fi
          mkdir -p "$DOCKER_CONFIG"
          COMPOSE="docker compose -f $GITHUB_WORKSPACE/deploy/docker-compose.yml --project-directory $DEPLOY_DIR"

          # 依次尝试 ACR → Docker Hub → GHCR，每个源重试 3 次
          # 只拉 meow-music：lrcapi / gomusic 是 Docker Hub 上的第三方镜像，
          # 在拉不动 Docker Hub 的机器上会把整个 pull 拖死；它们本地已有，不需要每次更新
          try_pull() {
            for i in 1 2 3; do
              echo "--- 尝试 $1（第 $i 次）---"
              if MEOW_IMAGE="$1" $COMPOSE pull meow-music; then
                echo "MEOW_IMAGE=$1" >> "$GITHUB_ENV"
                echo "✅ 拉取成功：$1"
                return 0
              fi
              sleep 5
            done
            return 1
          }

          if try_pull "$IMAGE_ACR:$TAG"; then exit 0; fi
          echo "⚠️ ACR 三次均失败，回落 Docker Hub"
          if try_pull "$IMAGE_DOCKERHUB:$TAG"; then exit 0; fi
          echo "⚠️ Docker Hub 也失败，回落 GHCR"
          echo "$GH_TOKEN_FOR_GHCR" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          try_pull "$IMAGE_GHCR:$TAG"

      - name: 重建容器
        run: |
          docker compose \
            -f "$GITHUB_WORKSPACE/deploy/docker-compose.yml" \
            --project-directory "$DEPLOY_DIR" \
            up -d --remove-orphans

      - name: 健康检查
        run: |
          set -e
          for i in $(seq 1 20); do
            if curl -fsS -m 3 http://127.0.0.1:2233/ > /dev/null; then
              echo "✅ 服务已就绪（第 ${i} 次探测）"
              curl -fsS -m 5 "http://127.0.0.1:2233/api/search?query=%E5%91%A8%E6%9D%B0%E4%BC%A6&limit=1" > /dev/null \
                && echo "✅ 搜索接口正常" || echo "⚠️ 搜索接口无响应（不影响启动）"
              docker image prune -f --filter "until=24h" > /dev/null 2>&1 || true
              exit 0
            fi
            sleep 3
          done
          echo "❌ 20 次探测仍不可用，输出容器日志："
          docker compose \
            -f "$GITHUB_WORKSPACE/deploy/docker-compose.yml" \
            --project-directory "$DEPLOY_DIR" \
            logs --tail 80
          exit 1

      - name: 部署后状态
        if: always()
        run: |
          docker ps --filter name=meow-music --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          echo "--- 磁盘 ---"
          df -h /vol1 | tail -1
