# 部署到国内 NAS（self-hosted runner，label: nas）
#
# 从 docker-build-deploy.yml 拆出来，原因见那个文件顶部的注释：
# 部署需要一台可能离线的机器，不该和「出镜像」共用并发组。
#
# 触发方式：只有手动（Actions → Deploy to NAS → Run workflow）。
# NAS 关机 / runner 没起来时不会有人替你排队，也不会拖累构建。
#
# 想恢复「push 后自动部署」的话，把下面的注释块加回来即可 ——
# 注意 workflow_run 触发的 run 里 GITHUB_SHA 是默认分支最新提交、
# 不是触发它的那个 commit，checkout 必须显式用 head_sha，
# 否则部署用的 compose 文件可能和镜像版本对不上。
#
# on:
#   workflow_run:
#     workflows: ["Build and Push Docker Image"]
#     types: [completed]
#     branches: [main]

name: Deploy to NAS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '要部署的镜像 tag（latest / sha-xxxxxxx）'
        type: string
        default: latest
        required: true

# 独立并发组：和构建互不影响。连续手动触发时排队而不是互相取消，
# 避免「容器重建到一半被掐掉」。
concurrency:
  group: deploy-nas
  cancel-in-progress: false

env:
  IMAGE_DOCKERHUB: joe1280/meowmusic
  IMAGE_GHCR: ghcr.io/joe12801/meowmusic
  # 阿里云个人版 ACR（公开仓库，拉取不需要登录；国内拉取比 Docker Hub 快且不限流）
  IMAGE_ACR: crpi-wv2uaegt8g2y0g3c.cn-guangzhou.personal.cr.aliyuncs.com/joeloveqt-project/meowmusic
  ACR_REGISTRY: crpi-wv2uaegt8g2y0g3c.cn-guangzhou.personal.cr.aliyuncs.com
  # NAS 上的部署目录（存放 .env 与 data/，compose 文件由每次 checkout 提供）
  DEPLOY_DIR: /vol1/meowmusic/deploy

jobs:
  deploy:
    name: Deploy to NAS
    runs-on: [self-hosted, nas]
    timeout-minutes: 30
    permissions:
      # 读仓库文件（checkout 走不通时用 Contents API 拉 compose）
      contents: read
    env:
      # 该 runner 的 joe1280 用户没有 home 目录，docker login 会 mkdir /home/joe1280 失败
      DOCKER_CONFIG: ${{ github.workspace }}/.docker
      TAG: ${{ inputs.image_tag }}
    steps:
      # 这台 NAS 到 github.com:443 时通时不通（2026-11-23 14:21 那次就是
      # 「Failed to connect to github.com port 443 after 134135 ms」，三次重试全挂）。
      # runner 到 GitHub 的控制通道没问题，只有 git fetch 走不通，所以 checkout 失败
      # 不该让整条部署报废 —— 部署真正需要的只有 deploy/docker-compose.yml。
      - name: Checkout (取 deploy/docker-compose.yml)
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        # 正常 17 秒；GitHub 抽风时 git 单次连接超时就是 134 秒、还会重试 3 次，
        # 掐在 2 分钟，失败就赶紧走后面的 API / 缓存兜底，别干等 7 分钟。
        timeout-minutes: 2

      # 文件优先级：本次 checkout > GitHub API 直取 > NAS 本地缓存 > 部署目录存量。
      # 每次拿到文件都会刷新本地缓存，之后彻底断网也能照常 pull + 重建。
      - name: 准备 compose 文件
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e
          CACHE="$DEPLOY_DIR/.repo-cache"
          WS_COMPOSE="$GITHUB_WORKSPACE/deploy/docker-compose.yml"
          CHOSEN=""

          # 用 Contents API 取单个文件：git 走的是 github.com:443，API 走 api.github.com，
          # 两个主机被墙/被代理漏掉的情况经常不一致 —— runner 能收到 job 就说明 API 通。
          fetch_api() { # $1=仓库内路径  $2=本地目标
            mkdir -p "$(dirname "$2")"
            curl -fsS -m 40 \
              -H "Authorization: Bearer $GH_API_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/$REPO_SLUG/contents/$1?ref=$COMMIT_SHA" \
              -o "$2"
          }

          if [ -f "$WS_COMPOSE" ]; then
            mkdir -p "$CACHE/qishui"
            cp "$WS_COMPOSE" "$CACHE/docker-compose.yml"
            if [ -f "$GITHUB_WORKSPACE/deploy/qishui/proxy.cjs" ]; then
              cp "$GITHUB_WORKSPACE/deploy/qishui/proxy.cjs" "$CACHE/qishui/proxy.cjs"
            fi
            echo "✅ 使用本次 checkout 的 compose（已刷新本地缓存）"
            CHOSEN="$WS_COMPOSE"
          elif fetch_api deploy/docker-compose.yml "$CACHE/docker-compose.yml" \
               && fetch_api deploy/qishui/proxy.cjs "$CACHE/qishui/proxy.cjs"; then
            echo "✅ checkout 失败，但已通过 GitHub API 取到 compose（已刷新本地缓存）"
            CHOSEN="$CACHE/docker-compose.yml"
          elif [ -f "$CACHE/docker-compose.yml" ]; then
            echo "⚠️ API 也不通，回退到 NAS 本地缓存"
            CHOSEN="$CACHE/docker-compose.yml"
          elif [ -f "$DEPLOY_DIR/docker-compose.yml" ]; then
            echo "⚠️ 无缓存，回退到部署目录存量 compose"
            CHOSEN="$DEPLOY_DIR/docker-compose.yml"
          else
            echo "❌ 没有可用的 docker-compose.yml（checkout / API 均失败且无缓存），无法部署"
            exit 1
          fi
          echo "MEOW_COMPOSE_FILE=$CHOSEN" >> "$GITHUB_ENV"
          echo "实际使用的 compose：$CHOSEN"

      - name: 记录当前镜像
        run: |
          echo "将要部署的 tag: $TAG"
          docker inspect -f '{{.Image}}' meow-music 2>/dev/null || echo "none"
          docker image inspect joe1280/meowmusic:latest \
            --format '当前 running 镜像: {{.Id}} ({{.Created}})' 2>/dev/null || true

      # compose 里 qishui-proxy 挂载 ./qishui-proxy/proxy.cjs（相对 project-directory），
      # 这个文件不在 docker-compose.yml 里，也不随 .env 常驻，必须每次从仓库同步过来，
      # 否则「带 --profile qishui 的 up」会因挂载源缺失直接失败。
      - name: 同步汽水代理脚本
        run: |
          set -e
          SRC="$(dirname "$MEOW_COMPOSE_FILE")/qishui/proxy.cjs"
          mkdir -p "$DEPLOY_DIR/qishui-proxy"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DEPLOY_DIR/qishui-proxy/proxy.cjs"
          else
            echo "⚠️ 源文件 $SRC 不存在，沿用部署目录里已有的 proxy.cjs"
          fi
          ls -la "$DEPLOY_DIR/qishui-proxy/"

      - name: Pull 镜像
        env:
          GH_TOKEN_FOR_GHCR: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -z "$TAG" ]; then echo "❌ image_tag 为空"; exit 1; fi
          mkdir -p "$DOCKER_CONFIG"
          COMPOSE="docker compose -f $MEOW_COMPOSE_FILE --project-directory $DEPLOY_DIR"

          # 依次尝试 ACR → Docker Hub → GHCR，每个源重试 3 次
          # 只拉 meow-music：lrcapi / gomusic 是 Docker Hub 上的第三方镜像，
          # 在拉不动 Docker Hub 的机器上会把整个 pull 拖死；它们本地已有，不需要每次更新
          try_pull() {
            for i in 1 2 3; do
              echo "--- 尝试 $1（第 $i 次）---"
              if MEOW_IMAGE="$1" $COMPOSE pull meow-music; then
                echo "MEOW_IMAGE=$1" >> "$GITHUB_ENV"
                echo "✅ 拉取成功：$1"
                return 0
              fi
              sleep 5
            done
            return 1
          }

          if try_pull "$IMAGE_ACR:$TAG"; then exit 0; fi
          echo "⚠️ ACR 三次均失败，回落 Docker Hub"
          if try_pull "$IMAGE_DOCKERHUB:$TAG"; then exit 0; fi
          echo "⚠️ Docker Hub 也失败，回落 GHCR"
          echo "$GH_TOKEN_FOR_GHCR" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          try_pull "$IMAGE_GHCR:$TAG"

      - name: 重建容器
        run: |
          set -e
          COMPOSE="docker compose -f $MEOW_COMPOSE_FILE --project-directory $DEPLOY_DIR"
          # qishui-proxy 在 compose 里带 profiles:["qishui"]，不带 profile 就是「永不启动」，
          # 而主服务的 QISHUI_BASE 默认指向它 —— 这就是「汽水搜索恒为空」的根因。
          # 万一 node 镜像拉不动导致整条 up 失败，回退成不带 profile 的部署，别把主服务拖下水。
          if $COMPOSE --profile qishui up -d --remove-orphans; then
            echo "✅ 已按 qishui profile 部署（含汽水搜索代理）"
          else
            echo "⚠️ 带 qishui profile 的 up 失败（多为 node 镜像拉取失败），回退为不含 sidecar 的部署"
            $COMPOSE up -d --remove-orphans
          fi

      - name: 健康检查
        run: |
          set -e
          for i in $(seq 1 20); do
            if curl -fsS -m 3 http://127.0.0.1:2233/ > /dev/null; then
              echo "✅ 服务已就绪（第 ${i} 次探测）"
              curl -fsS -m 5 "http://127.0.0.1:2233/api/search?query=%E5%91%A8%E6%9D%B0%E4%BC%A6&limit=1" > /dev/null \
                && echo "✅ 搜索接口正常" || echo "⚠️ 搜索接口无响应（不影响启动）"
              docker image prune -f --filter "until=24h" > /dev/null 2>&1 || true
              exit 0
            fi
            sleep 3
          done
          echo "❌ 20 次探测仍不可用，输出容器日志："
          docker compose \
            -f "$MEOW_COMPOSE_FILE" \
            --project-directory "$DEPLOY_DIR" \
            logs --tail 80
          exit 1

      - name: 部署后状态
        if: always()
        run: |
          docker ps --filter name=meow-music --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          echo "--- 磁盘 ---"
          df -h /vol1 | tail -1
