<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歌词 · Meow Music</title>
<style>
  :root{
    --bg:#0b0d11; --panel:#151820; --line:#262b36;
    --text:#e9edf5; --muted:#8b93a7; --accent:#4ea1ff; --dim:#5c6478;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%, #1b2231 0%, var(--bg) 60%);
    color:var(--text);font:15px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);
    background:rgba(21,24,32,.72);backdrop-filter:blur(8px);flex-wrap:wrap}
  .title{font-weight:600}
  .artist{color:var(--muted);font-size:13px}
  .grow{flex:1}
  input{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);
    padding:6px 10px;font-size:13px;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);
    padding:6px 12px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  a{color:var(--accent);text-decoration:none;font-size:13px}
  #wrap{flex:1;overflow-y:auto;padding:36vh 24px 45vh;scroll-behavior:smooth}
  #lines{max-width:760px;margin:0 auto;text-align:center}
  .l{color:var(--dim);font-size:20px;line-height:2.1;transition:color .25s,transform .25s,opacity .25s;
    cursor:pointer;padding:2px 0}
  .l:hover{color:var(--muted)}
  .l.active{color:#fff;font-size:24px;font-weight:600;transform:scale(1.02);
    text-shadow:0 0 26px rgba(78,161,255,.35)}
  .tr{display:block;font-size:13px;line-height:1.6;margin-top:2px;color:var(--dim);font-weight:400}
  .l.active .tr{color:#c3cde0}
  .plain .l{cursor:default}
  .plain .l:hover{color:var(--dim)}
  #hint{text-align:center;color:var(--muted);padding:40px 0;line-height:1.9}
  footer{border-top:1px solid var(--line);background:rgba(21,24,32,.86);padding:10px 16px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  audio{flex:1;min-width:220px;height:36px}
  .tag{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <div class="title" id="song">歌词</div>
    <div class="artist" id="artist">&nbsp;</div>
  </div>
  <span class="grow"></span>
  <input id="q-song" placeholder="歌名" size="12">
  <input id="q-singer" placeholder="歌手" size="10">
  <button id="go">查歌词</button>
  <a href="/">返回播放器</a>
</header>

<div id="wrap">
  <div id="lines"><div id="hint">正在获取歌词…</div></div>
</div>

<footer>
  <audio id="audio" controls preload="metadata"></audio>
  <span class="tag" id="tag"></span>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const song = params.get('song') || '';
const singer = params.get('singer') || '';
const audioURL = params.get('audio') || params.get('url') || '';

let lines = [];
let lineEls = [];
let activeIdx = -1;
let syncedMode = false;

$('song').textContent = song || '歌词';
$('artist').textContent = singer || '';
$('q-song').value = song;
$('q-singer').value = singer;

if(audioURL){
  $('audio').src = audioURL;
} else {
  $('audio').style.display = 'none';
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function render(data){
  const box = $('lines');
  if(!data.success || !data.lines || data.lines.length === 0){
    box.innerHTML = '<div id="hint">' +
      esc(data.message || '暂无歌词') +
      '<br><span style="font-size:12px">可以换个「歌名 / 歌手」再试，或直接点下面的播放器听歌</span></div>';
    $('tag').textContent = '';
    return;
  }
  lines = data.lines;
  lineEls = [];
  const synced = !!data.synced;
  syncedMode = synced;
  box.classList.toggle('plain', !synced);
  box.innerHTML = lines.map((l, i) =>
    '<div class="l" data-i="' + i + '" data-t="' + l.time + '">' + esc(l.text) +
    (l.trans ? '<span class="tr">' + esc(l.trans) + '</span>' : '') + '</div>'
  ).join('');
  lineEls = Array.from(box.querySelectorAll('.l'));
  lineEls.forEach(el => {
    el.addEventListener('click', () => {
      if(!synced || !audioURL) return;
      const t = parseFloat(el.dataset.t);
      const a = $('audio');
      if(!isNaN(t)){ a.currentTime = t; a.play().catch(()=>{}); highlight(parseInt(el.dataset.i, 10) || 0); }
    });
  });
  $('tag').textContent = '来源：' + sourceName(data.source) +
    (synced ? ' · ' + lines.length + ' 行（带时间轴）' : ' · 纯文本歌词') +
    (data.has_trans ? ' · 双语' : '');
  if(synced) highlight(0);
  else { $('tag').textContent += ' · 无时间轴，不做高亮'; }
}

function sourceName(s){
  if(s === 'cache') return '本地缓存';
  if(s === 'lrclib') return 'LRCLIB';
  if(s === 'netease') return '网易云';
  return s || '未知';
}

function highlight(idx){
  if(idx === activeIdx) return;
  activeIdx = idx;
  lineEls.forEach((el, i) => el.classList.toggle('active', i === idx));
  const el = lineEls[idx];
  if(el){
    const wrap = $('wrap');
    const target = el.offsetTop - wrap.clientHeight / 2 + el.clientHeight / 2;
    wrap.scrollTo({top: Math.max(0, target), behavior:'smooth'});
  }
}

function sync(){
  const a = $('audio');
  if(!audioURL || !syncedMode) return;
  const t = a.currentTime;
  let idx = -1;
  for(let i = 0; i < lines.length; i++){
    if(lines[i].time <= t + 0.15) idx = i; else break;
  }
  if(idx >= 0) highlight(idx);
}

$('audio').addEventListener('timeupdate', sync);
$('audio').addEventListener('seeked', sync);

async function load(s, ar){
  const qs = new URLSearchParams({song: s, singer: ar || '', trans: '1'});
  $('lines').innerHTML = '<div id="hint">正在获取歌词…</div>';
  try{
    const r = await fetch('/api/lyric?' + qs.toString(), {cache:'no-store'});
    render(await r.json());
  }catch(e){
    $('lines').innerHTML = '<div id="hint">获取歌词失败：' + esc(e.message) + '</div>';
  }
}

$('go').addEventListener('click', () => {
  const s = $('q-song').value.trim();
  const ar = $('q-singer').value.trim();
  if(!s) return;
  const u = new URL(location.href);
  u.searchParams.set('song', s);
  u.searchParams.set('singer', ar);
  history.replaceState(null, '', u);
  $('song').textContent = s;
  $('artist').textContent = ar;
  load(s, ar);
});

if(song) load(song, singer);
else $('lines').innerHTML = '<div id="hint">在上面填「歌名 / 歌手」再点查歌词</div>';
</script>
</body>
</html>
