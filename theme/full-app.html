        async function loadLyrics(song) {
            const lyricsContent = document.getElementById('lyricsContent');
            const lyricsTitle = document.getElementById('lyricsTitle');
            const lyricsArtist = document.getElementById('lyricsArtist');
            const lyricsToggle = document.getElementById('lyricsToggle');

            const title = song.title || song.Title || '';
            const artist = song.artist || song.Artist || '';

            // 更新歌词区域标题
            lyricsTitle.textContent = title || '未知歌曲';
            lyricsArtist.textContent = artist || '未知艺术家';

            // 切歌先清空，否则上一首的歌词会留在面板上继续高亮
            lyricsData = [];
            currentLyricIndex = -1;
            lastLyricLRC = '';
            lastLyricSource = '';

            const lyricUrl = song.lyric_url || song.LyricURL || song.lyricUrl;
            if (!title && !lyricUrl) {
                showNoLyrics('该歌曲暂无歌词');
                return;
            }

            lyricsContent.innerHTML = '<div class="no-lyrics">正在加载歌词…</div>';
            setMiniLyric('正在加载歌词…', '', true);
            // 有歌就显示悬浮按钮，没歌词也能点开去看手动搜索入口
            lyricsToggle.classList.add('active');

            try {
                let data = null;

                // 首选：带翻译的 JSON（服务端已解析好时间轴，含 trans）
                if (title) {
                    const qs = new URLSearchParams({ song: title, singer: artist, trans: '1' });
                    const resp = await fetch('/api/lyric?' + qs.toString(), { cache: 'no-store' });
                    if (resp.ok) data = await resp.json().catch(() => null);
                }

                if (data && data.success && Array.isArray(data.lines) && data.lines.length > 0) {
                    lyricsData = data.lines.map(l => ({
                        time: typeof l.time === 'number' ? l.time : -1,
                        text: l.text || '',
                        trans: l.trans || ''
                    }));
                    lastLyricLRC = data.lrc || lyricsData.map(l =>
                        l.time >= 0 ? '[' + fmtLrcTime(l.time) + ']' + l.text : l.text).join('\n');
                    lastLyricSource = data.source || '';
                } else if (lyricUrl) {
                    // 兜底：音源自带的 lyric_url（通常是纯 LRC 文本）
                    const r2 = await fetch(lyricUrl);
                    const text = r2.ok ? await r2.text() : '';
                    if (text && text.trim()) {
                        lyricsData = parseLRC(text);
                        lastLyricLRC = text;
                    }
                }

                if (lyricsData.length === 0) {
                    showNoLyrics((data && data.message) || '该歌曲暂无歌词');
                    return;
                }

                displayLyrics();
                updateLyricEditBtn();
                lyricsToggle.classList.add('active');

                // 上次是开着歌词的，切歌后继续保持打开
                try {
                    if (localStorage.getItem(LYRICS_OPEN_KEY) === '1') toggleLyrics(true);
                } catch (e) {}

                const audio = document.getElementById('audioPlayer');
                if (lyricsData[0] && lyricsData[0].time < 0) {
                    // 纯文本歌词：没有时间轴，就固定显示第一行
                    setMiniLyric(lyricsData[0].text, lyricsData[0].trans || '', false);
                } else if (audio) {
                    updateLyrics(audio.currentTime);
                }
            } catch (error) {
                console.error('加载歌词失败:', error);
                showNoLyrics('歌词加载失败');
            }
        }

        // 解析LRC格式歌词
        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            
            const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;
            
            lines.forEach(line => {
                const matches = [...line.matchAll(timeRegex)];
                if (matches.length > 0) {
                    const text = line.replace(timeRegex, '').trim();
                    if (text) {
                        matches.forEach(match => {
                            const minutes = parseInt(match[1]);
                            const seconds = parseInt(match[2]);
                            const milliseconds = parseInt(match[3].padEnd(3, '0'));
                            const time = minutes * 60 + seconds + milliseconds / 1000;
                            result.push({ time, text });
                        });
                    }
                }
            });
            
            // 按时间排序
            result.sort((a, b) => a.time - b.time);
            return result;
        }

        // 显示歌词列表
        function displayLyrics() {
            const lyricsContent = document.getElementById('lyricsContent');

            const html = lyricsData.map((lyric, index) => {
                const trans = lyric.trans
                    ? '<span class="lyric-trans">' + escapeLyricHTML(lyric.trans) + '</span>'
                    : '';
                return `<div class="lyric-line" data-index="${index}" data-time="${lyric.time}" ` +
                    `onclick="seekToLyric(${lyric.time})">${escapeLyricHTML(lyric.text)}${trans}</div>`;
            }).join('');

            lyricsContent.innerHTML = html;
            currentLyricIndex = -1;
        }

        // 更新当前歌词高亮
        function updateLyrics(currentTime) {
            if (lyricsData.length === 0) return;
            // 纯文本歌词（time = -1）没有时间轴，不做高亮也不滚动
            if (lyricsData[0].time < 0) {
                setMiniLyric(lyricsData[0].text, lyricsData[0].trans || '', false);
                return;
            }

            // 找到当前应该高亮的歌词
            let newIndex = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime >= lyricsData[i].time) {
                    newIndex = i;
                } else {
                    break;
                }
            }

            if (newIndex !== currentLyricIndex) {
                currentLyricIndex = newIndex;

                const box = document.getElementById('lyricsContent');
                const lines = box.querySelectorAll('.lyric-line');
                lines.forEach((line, index) => {
                    line.classList.remove('active', 'passed');
                    if (index === currentLyricIndex) {
                        line.classList.add('active');
                    } else if (index < currentLyricIndex) {
                        line.classList.add('passed');
                    }
                });

                // 只滚动歌词容器本身，避免整页跟着跳
                const active = lines[currentLyricIndex];
                if (active) {
                    const cur = lyricsData[currentLyricIndex];
                    setMiniLyric(cur.text, cur.trans || '', false);
                    const target = active.offsetTop - box.clientHeight / 2 + active.clientHeight / 2;
                    box.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
                } else {
                    // 还没到第一句（前奏）
                    setMiniLyric('♪ 前奏…', '', true);
                }
            }
        }

        // 点击歌词跳转播放位置
        function seekToLyric(time) {
            if (!(time >= 0)) return;
            const audio = document.getElementById('audioPlayer');
            audio.currentTime = time;
            audio.play().catch(() => {});
        }

        // 监听音频时间更新
        document.addEventListener('DOMContentLoaded', function() {
            const audio = document.getElementById('audioPlayer');
            if (!audio) return;

            // 播放/暂停动画控制
            audio.addEventListener('play', () => {
                document.getElementById('vinylRecord').classList.add('playing');
                document.getElementById('musicWaves').style.opacity = '1';
                reportNow(true);
            });

            audio.addEventListener('pause', () => {
                document.getElementById('vinylRecord').classList.remove('playing');
                document.getElementById('musicWaves').style.opacity = '0';
                reportNow(false);
            });

            // 元数据到了再报一次：play 事件那一刻 duration 还是 NaN，
            // 首屏不补一次 /status 会显示「0:00 / --:--」
            audio.addEventListener('loadedmetadata', () => reportNow(!audio.paused, true));

            // 歌词同步 + 播放历史上报（听到一定时长才算一次播放，拖进度条不重复计数）
            audio.addEventListener('timeupdate', () => {
                updateLyrics(audio.currentTime);
                maybeReportPlay(false);
                reportNow(true); // 内部 8 秒节流，兼当 /status 的「正在播放」心跳
            });

            // 播放结束处理（全站只此一处：原来重复注册了三份，顺序播放会连跳三首）
            audio.addEventListener('ended', function() {
                reportNow(false);
                // 睡眠定时的「本首播完停」
                if (stopAfterSong) {
                    stopAfterSong = false;
                    updateSleepUI();
                    toast('🌙 本首已播完，已暂停');
                    maybeReportPlay(true);
                    return;
                }

                // 短歌可能没到上报阈值，结束时补一次
                maybeReportPlay(true);

                if (playMode === 'single') {
                    audio.currentTime = 0;
                    audio.play();
                } else if (playMode === 'loop' || playMode === 'random') {
                    playNext();
                } else if (playMode === 'list') {
                    if (currentIndex < currentSongList.length - 1) {
                        playNext();
                    }
                }
            });
        });

        // 播放列表中的歌曲
        function playFromList(songs, index) {
            currentSongList = songs;
            currentIndex = index;
            playSong(songs[index], index);
        }

        // 播放全部
        function playAll(songs) {
            if (!songs || songs.length === 0) {
                alert('没有可播放的歌曲');
                return;
            }
            currentSongList = songs;
            currentIndex = 0;
            playSong(songs[0], 0);
        }

        // 下一首
        function playNext() {
            if (currentSongList.length === 0) return;
            
            if (playMode === 'single') {
                // 单曲循环：重新播放当前歌曲
                const audio = document.getElementById('audioPlayer');
                audio.currentTime = 0;
                audio.play();
                return;
            }
            
            if (playMode === 'random') {
                // 随机播放
                currentIndex = Math.floor(Math.random() * currentSongList.length);
            } else {
                // 顺序播放和列表循环
                currentIndex = (currentIndex + 1) % currentSongList.length;
                if (playMode === 'list' && currentIndex === 0) {
                    // 顺序播放到最后一首后停止
                    return;
                }
            }
            
            playSong(currentSongList[currentIndex], currentIndex);
        }

        // 上一首
        function playPrevious() {
            if (currentSongList.length === 0) return;
            
            if (playMode === 'random') {
                // 随机播放
                currentIndex = Math.floor(Math.random() * currentSongList.length);
            } else {
                // 顺序播放和循环播放
                currentIndex = (currentIndex - 1 + currentSongList.length) % currentSongList.length;
            }
            
            playSong(currentSongList[currentIndex], currentIndex);
        }

        const SRC_META = {
            kuwo:    { name: '酷我',    color: '#1f6fff', glyph: 'note' },
            netease: { name: '网易云',  color: '#e0002b', glyph: 'note' },
            qq:      { name: 'QQ音乐',  color: '#16a34a', glyph: 'note' },
            kugou:   { name: '酷狗',    color: '#0b6fd4', glyph: 'note' },
            qishui:  { name: '汽水',    color: '#00b389', glyph: 'note' },
            ext:     { name: 'YouTube', color: '#ff0033', glyph: 'play' }
        };
        const SRC_GLYPH_NOTE =
            '<svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true">' +
            '<path d="M6.1 12.3V4.2l5.9-1.3v8.2" fill="none" stroke="currentColor" stroke-width="1.5" ' +
            'stroke-linecap="round" stroke-linejoin="round"/>' +
            '<ellipse cx="4.4" cy="12.4" rx="1.8" ry="1.5" fill="currentColor"/>' +
            '<ellipse cx="10.3" cy="11.1" rx="1.8" ry="1.5" fill="currentColor"/></svg>';
        const SRC_GLYPH_PLAY =
            '<svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true">' +
            '<rect x="1" y="3.6" width="14" height="8.8" rx="2.4" fill="currentColor"/>' +
            '<path d="M6.6 6.1l3.9 1.9-3.9 1.9z" fill="#fff"/></svg>';

        function srcRgba(hex, alpha) {
            const h = String(hex).replace('#', '');
            const r = parseInt(h.slice(0, 2), 16) || 0;
            const g = parseInt(h.slice(2, 4), 16) || 0;
            const b = parseInt(h.slice(4, 6), 16) || 0;
            return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
        }

        // srcBadge('kuwo') -> 带 logo 的小标签；未知/空来源返回空串
        function srcBadge(src) {
            const m = SRC_META[String(src || '').toLowerCase()];
            if (!m) return '';
            const glyph = m.glyph === 'play' ? SRC_GLYPH_PLAY : SRC_GLYPH_NOTE;
            return '<span class="src-tag" title="音源：' + m.name + '" style="color:' + m.color +
                ';background:' + srcRgba(m.color, 0.12) + ';border-color:' + srcRgba(m.color, 0.3) + '">' +
                glyph + m.name + '</span>';
        }

        // 内联 onclick 里塞对象：JSON 里的单引号要转义，否则会提前闭合属性
        function jsArg(o) {
            return JSON.stringify(o).replace(/'/g, '\\u0027');
        }

        function fmtAgo(ts) {
            if (!ts) return '';
            const diff = Math.floor(Date.now() / 1000) - ts;
            if (diff < 60) return '刚刚';
            if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
            if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
            return new Date(ts * 1000).toLocaleDateString('zh-CN');
        }

        function switchHistoryView(v) {
            historyView = v === 'top' ? 'top' : 'recent';
            renderHistory();
        }

        async function loadHistory() {
            const box = document.getElementById('historyList');
            if (!box) return;
            if (!token) {
                box.innerHTML = '<div class="empty-state">登录后才会记录播放历史（可以跨设备同步）</div>';
                document.getElementById('historySummary').textContent = '未登录';
                return;
            }
            box.innerHTML = '<div class="loading">加载中...</div>';
            try {
                const r = await fetch('/api/history?limit=60', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const d = await r.json();
                historyRecent = d.recent || [];
                historyTop = d.top || [];
                const sum = document.getElementById('historySummary');
                if (sum) {
                    sum.textContent = '共 ' + (d.total_songs || 0) + ' 首 · 累计播放 ' +
                        (d.total_plays || 0) + ' 次';
                }
                renderHistory();
            } catch (e) {
                box.innerHTML = '<div class="empty-state">加载失败：' + escapeHtml(e.message) + '</div>';
            }
        }

        function renderHistory() {
            const box = document.getElementById('historyList');
            if (!box) return;
            const arr = historyView === 'top' ? historyTop : historyRecent;
            const bRecent = document.getElementById('histTabRecent');
            const bTop = document.getElementById('histTabTop');
            if (bRecent) bRecent.classList.toggle('active', historyView === 'recent');
            if (bTop) bTop.classList.toggle('active', historyView === 'top');

            if (!arr.length) {
                box.innerHTML = '<div class="empty-state">还没有播放记录，搜一首听听吧 🎵</div>';
                return;
            }

            const head = '<div style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
                '<button class="btn-icon" onclick="playHistoryAll()" style="background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;padding:9px 18px;border:none;border-radius:20px;cursor:pointer;font-weight:600;">▶ 全部播放</button>' +
                '<span style="font-size:12px;color:#999;">点击「下一首」可以插队，不打断当前播放</span>' +
                '</div>';

            box.innerHTML = head + '<div class="song-list">' + arr.map((s, i) => `
                <div class="song-item">
                    <div class="song-info" style="flex:1;min-width:0;">
                        <div class="song-title">${escapeHtml(s.title)}${srcBadge(s.source)}</div>
                        <div class="song-artist">${escapeHtml(s.artist || '未知艺术家')}${s.count > 1 ? ' · 听过 ' + s.count + ' 次' : ''}${s.last_at ? ' · ' + fmtAgo(s.last_at) : ''}</div>
                    </div>
                    <div class="song-actions" style="display:flex;gap:8px;align-items:center;flex:none;flex-wrap:wrap;justify-content:flex-end;">
                        <button class="btn-icon btn-play" onclick="playHistoryAt(${i})">播放</button>
                        <button class="btn-icon" onclick='queueNext(${jsArg(s)})' title="插到下一首" style="padding:6px 10px;">下一首</button>
                        <a class="btn-icon" href="/lyrics?song=${encodeURIComponent(s.title || '')}&singer=${encodeURIComponent(s.artist || '')}" target="_blank" rel="noopener" title="看歌词" style="padding:6px 10px;">歌词</a>
                    </div>
                </div>
            `).join('') + '</div>';
        }

        function currentHistoryList() {
            return historyView === 'top' ? historyTop : historyRecent;
        }

        function playHistoryAt(i) {
            const arr = currentHistoryList();
            if (!arr[i]) return;
            playFromList(arr, i);
        }

        function playHistoryAll() {
            const arr = currentHistoryList();
            if (!arr.length) return;

        async function clearHistory() {
            if (!token) { alert('请先登录'); return; }
            if (!confirm('清空全部播放记录？这个操作不能撤销。')) return;
            try {
                const r = await fetch('/api/history/clear', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                historyRecent = []; historyTop = [];
                renderHistory();
                document.getElementById('historySummary').textContent = '共 0 首';

            } catch (e) {
                alert('清空失败：' + e.message);
            }
        }

        /* ===== 播放上报：听到一定时长才算一次，避免点了就退也算 ===== */
        let pendingHistory = null;

        function armHistoryReport(song) {
            pendingHistory = { song: song, reported: false };
        }

        function maybeReportPlay(force) {
            if (!pendingHistory || pendingHistory.reported || !token) return;
            const audio = document.getElementById('audioPlayer');
            if (!audio) return;
            const dur = audio.duration || 0;
            // 短歌（<40 秒）听到一半就计数，长歌听满 20 秒
            const need = dur > 0 && dur < 40 ? Math.max(5, dur * 0.5) : 20;
            if (!force && audio.currentTime < need) return;
            pendingHistory.reported = true;
            const s = pendingHistory.song;
            fetch('/api/history/report', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    title: s.title || '',
                    artist: s.artist || '',
                    duration: Math.round(dur || 0),
                    cover_url: s.cover_url || '',
                    source: s.source || s.Source || ''
                })
            }).catch(function () {});
        }

        /* ===== 正在播放心跳：/status 顶部显示「此刻在放哪首」 ===== */
        function nowClientId() {
            let id = '';
            try { id = localStorage.getItem('meow_client_id') || ''; } catch (e) {}
            if (!id) {
                id = 'c' + Math.random().toString(36).slice(2, 10);
                try { localStorage.setItem('meow_client_id', id); } catch (e) {}
            }
            return id;
        }

        let nowSentAt = 0;

        // timeupdate 一秒会打四五次，8 秒节流；暂停/切歌/播完则立刻报
        function reportNow(playing, force) {
            if (!token || !currentSong) return;
            const audio = document.getElementById('audioPlayer');
            if (!audio) return;
            const t = Date.now();
            if (playing && !force && t - nowSentAt < 8000) return;
            nowSentAt = t;
            // 真在响才算「播放中」：暂停时拖进度条也会触发 timeupdate，
            // 只看传参会把「暂停中」误报成正在播放
            const live = !!playing && !audio.paused;
            fetch('/api/now', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    title: currentSong.title || '',
                    artist: currentSong.artist || '',
                    cover_url: currentSong.cover_url || '',
                    source: currentSong.source || '',
                    duration: Math.round(audio.duration || currentSong.duration || 0),
                    position: Math.round(audio.currentTime || 0),
                    playing: live,
                    client: nowClientId()
                })
            }).catch(function () {});
        }

        /* ================= 播放队列 ================= */
        const QUEUE_KEY = 'meow_queue_v1';

        function normalizeQueueSong(s) {
            return {
                title: s.title || s.Title || '未知歌曲',
                artist: s.artist || s.Artist || '未知艺术家',
                source: s.source || s.Source || '',
                url: s.url || s.link || s.audio_url || s.audio_full_url ||
                     s.AudioURL || s.AudioFullURL || '',
                lyric_url: s.lyric_url || s.LyricURL || '',
                cover_url: s.cover_url || s.CoverURL || ''
            };
        }

        function saveQueue() {
            try {
                const list = (currentSongList || []).slice(0, 300).map(normalizeQueueSong);
                localStorage.setItem(QUEUE_KEY, JSON.stringify({
                    list: list, index: currentIndex, mode: playMode
                }));
            } catch (e) {}
            updateQueueBadge();
        }

        function restoreQueue() {
            try {
                const raw = localStorage.getItem(QUEUE_KEY);
                if (!raw) return;
                const d = JSON.parse(raw);
                if (d && Array.isArray(d.list) && d.list.length) {
                    currentSongList = d.list;
                    currentIndex = Math.max(0, Math.min(d.index || 0, d.list.length - 1));
                    updateQueueBadge();
                }
            } catch (e) {}
        }

        function updateQueueBadge() {
            const btn = document.getElementById('queueBtn');
            if (!btn) return;
            const n = (currentSongList || []).length;
            btn.title = n ? '播放队列（' + n + ' 首）' : '播放队列';
            btn.classList.toggle('on', n > 0);
        }

        // 插到下一首：不打乱当前播放
        function queueNext(song) {
            const item = normalizeQueueSong(song);
            if (!currentSongList || currentSongList.length === 0) {
                currentSongList = [item];
                currentIndex = 0;
                saveQueue();
                toast('已加入队列：' + item.title, 1800);
                return;
            }
            const at = Math.max(0, Math.min(currentIndex + 1, currentSongList.length));
            currentSongList.splice(at, 0, item);
            saveQueue();
            toast('已插到下一首：' + item.title, 1800);
            const modal = document.getElementById('queueModal');
            if (modal && modal.style.display === 'flex') renderQueue();
        }

        function openQueuePanel() {
            renderQueue();
            const m = document.getElementById('queueModal');
            if (m) m.style.display = 'flex';
        }

        function closeQueuePanel() {
            const m = document.getElementById('queueModal');
            if (m) m.style.display = 'none';
        }

        function renderQueue() {
            const box = document.getElementById('queueList');
            const sum = document.getElementById('queueSummary');
            if (!box) return;
            const n = (currentSongList || []).length;
            if (sum) {
                sum.textContent = n
                    ? '共 ' + n + ' 首 · 正在播第 ' + (currentIndex + 1) + ' 首'
                    : '队列是空的';
            }
            if (!n) {
                box.innerHTML = '<div class="empty-state">队列空着。<br>在搜索结果或「最近」里点「下一首」，就会排到这里。</div>';
                return;
            }
            box.innerHTML = currentSongList.map((s, i) => `
                <div class="queue-item ${i === currentIndex ? 'playing' : ''}">
                    <div class="q-idx">${i === currentIndex ? '▶' : (i + 1)}</div>
                    <div class="q-main" onclick="jumpQueueTo(${i})">
                        <div class="q-title">${escapeHtml(s.title || s.Title || '未知歌曲')}${srcBadge(s.source || s.Source)}</div>
                        <div class="q-artist">${escapeHtml(s.artist || s.Artist || '')}</div>
                    </div>
                    <div class="q-btns">
                        <button class="q-btn" onclick="moveQueueItem(${i}, -1)" title="上移">↑</button>
                        <button class="q-btn" onclick="moveQueueItem(${i}, 1)" title="下移">↓</button>
                        <button class="q-btn danger" onclick="removeQueueAt(${i})" title="移出队列">×</button>
                    </div>
                </div>
            `).join('');
        }

        function jumpQueueTo(i) {
            if (!currentSongList[i]) return;
            currentIndex = i;
            playSong(currentSongList[i], i);
            renderQueue();
        }

        function removeQueueAt(i) {
            if (i < 0 || i >= currentSongList.length) return;
            currentSongList.splice(i, 1);
            if (i < currentIndex) currentIndex--;
            if (currentIndex >= currentSongList.length) {
                currentIndex = Math.max(0, currentSongList.length - 1);
            }
            saveQueue();
            renderQueue();
        }

        function moveQueueItem(i, dir) {
            const j = i + dir;
            if (i < 0 || j < 0 || i >= currentSongList.length || j >= currentSongList.length) return;
            const tmp = currentSongList[i];
            currentSongList[i] = currentSongList[j];
            currentSongList[j] = tmp;
            // 正在播的那首跟着换位置，否则「▶」会标错行
            if (currentIndex === i) currentIndex = j;
            else if (currentIndex === j) currentIndex = i;
            saveQueue();
            renderQueue();
        }

        function clearQueue() {
            // 保留正在播的那首：清空队列不该把音乐停掉
            if (currentSong) {
                currentSongList = [currentSong];
                currentIndex = 0;
            } else {
                currentSongList = [];
                currentIndex = 0;
            }
            saveQueue();
            renderQueue();
            toast('队列已清空（当前这首保留）');
        }

        function shuffleQueue() {
            if (currentSongList.length <= 2) return;
            const start = currentIndex + 1;
            for (let i = currentSongList.length - 1; i > start; i--) {
                const j = start + Math.floor(Math.random() * (i - start + 1));
                const t = currentSongList[i];
                currentSongList[i] = currentSongList[j];
                currentSongList[j] = t;
            }
            saveQueue();
            renderQueue();
            toast('已打乱后面的 ' + Math.max(0, currentSongList.length - start) + ' 首');
        }

        async function saveQueueAsPlaylist() {
            if (!token) { alert('请先登录'); return; }
            if (!currentSongList.length) { alert('队列是空的'); return; }
            const name = prompt('把队列 ' + currentSongList.length + ' 首存成新歌单，取个名字：');
            if (!name || !name.trim()) return;
            try {
                const r = await fetch('/api/user/playlists/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ name: name.trim(), description: '来自播放队列' })
                });
                if (!r.ok) throw new Error('创建歌单失败');
                const pl = await r.json();
                let ok = 0;
                // 服务端是插到最前面，所以倒序提交才能保持队列顺序
                for (let i = currentSongList.length - 1; i >= 0; i--) {
                    const s = normalizeQueueSong(currentSongList[i]);
                    const body = {
                        title: s.title, artist: s.artist,
                        audio_url: s.url, audio_full_url: s.url,
                        lyric_url: s.lyric_url || '', cover_url: s.cover_url || '',
                        duration: 0
                    };
                    try {
                        const rr = await fetch('/api/user/playlists/add-song?playlist_id=' + encodeURIComponent(pl.id), {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                            body: JSON.stringify(body)
                        });
                        if (rr.ok) ok++;
                    } catch (e) {}
                }
                toast('已存为歌单「' + name.trim() + '」：' + ok + ' 首');
                loadPlaylists();
            } catch (e) {
                alert(e.message || '保存失败');
            }
        }

        /* ================= 睡眠定时 ================= */
        let sleepTimerId = null;
        let sleepEndAt = 0;
        let stopAfterSong = false;
        let sleepTicker = null;

        function openSleepMenu() {
            updateSleepUI();
            const m = document.getElementById('sleepModal');
            if (m) m.style.display = 'flex';
        }

        function closeSleepMenu() {
            const m = document.getElementById('sleepModal');
            if (m) m.style.display = 'none';
        }

        function setSleepTimer(min) {
            clearTimeout(sleepTimerId);
            stopAfterSong = false;
            sleepEndAt = Date.now() + min * 60000;
            sleepTimerId = setTimeout(function () {
                const audio = document.getElementById('audioPlayer');
                if (audio) audio.pause();
                sleepTimerId = null;
                sleepEndAt = 0;
                updateSleepUI();
                toast('🌙 睡眠定时到，已暂停播放');
            }, min * 60000);
            updateSleepUI();
            toast('🌙 ' + min + ' 分钟后自动暂停');
            closeSleepMenu();
        }

        function setSleepAfterSong() {
            clearTimeout(sleepTimerId);
            sleepTimerId = null;
            sleepEndAt = 0;
            stopAfterSong = true;
            updateSleepUI();
            toast('🌙 本首播完就暂停');
            closeSleepMenu();
        }

        function cancelSleepTimer() {
            clearTimeout(sleepTimerId);
            sleepTimerId = null;
            sleepEndAt = 0;
            stopAfterSong = false;
            updateSleepUI();
            const st = document.getElementById('sleepStatus');
            if (st) st.textContent = '已取消';
            toast('睡眠定时已取消');
        }

        function updateSleepUI() {
            const btn = document.getElementById('sleepBtn');
            const st = document.getElementById('sleepStatus');
            const leftMs = sleepEndAt - Date.now();
            let text = '未开启';
            if (stopAfterSong) text = '本首播完自动暂停';
            else if (sleepEndAt > 0 && leftMs > 0) {
                const mins = Math.ceil(leftMs / 60000);
                text = '约 ' + mins + ' 分钟后暂停';
            }
            if (st) st.textContent = text;

            const on = stopAfterSong || (sleepEndAt > 0 && leftMs > 0);
            if (btn) {
                btn.classList.toggle('on', on);
                btn.title = on ? '睡眠定时：' + text : '睡眠定时';
            }
            document.querySelectorAll('.sleep-opt').forEach(function (el) {
                el.classList.toggle('active', el.dataset.min === '0' && stopAfterSong);
            });

            if (on && !sleepTicker) {
                sleepTicker = setInterval(updateSleepUI, 15000);
            } else if (!on && sleepTicker) {
                clearInterval(sleepTicker);
                sleepTicker = null;
            }
        }

        /* ================= 轻提示 ================= */
        let toastTimer = null;
        function toast(msg, ms) {
            let el = document.getElementById('meowToast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'meowToast';
                el.style.cssText = 'position:fixed;left:50%;bottom:130px;transform:translateX(-50%);' +
                    'background:rgba(45,32,50,.92);color:#fff;padding:10px 18px;border-radius:20px;' +
                    'font-size:13px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;' +
                    'max-width:82vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18);';
                document.body.appendChild(el);
            }
            el.textContent = msg;
            el.style.opacity = '1';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { el.style.opacity = '0'; }, ms || 2200);
        }

        /* ================= 分享链接 / 歌词纠错 / 快捷键 ================= */

        // 秒 -> [00:12.34] 里的时间串
        function fmtLrcTime(t) {
            if (!(t >= 0)) return '00:00.00';
            const m = Math.floor(t / 60);
            const s = t - m * 60;
            return String(m).padStart(2, '0') + ':' + (s < 10 ? '0' : '') + s.toFixed(2);
        }

        // 复制到剪贴板：HTTP 下（局域网 IP 访问）没有 clipboard API，退化成 execCommand
        async function copyText(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) { return false; }
        }

        function currentShareURL() {
            if (!currentSong) return '';
            const q = new URLSearchParams({
                song: currentSong.title || '',
                singer: currentSong.artist || ''
            });
            return location.origin + '/?' + q.toString();
        }

        async function shareCurrentSong() {
            if (!currentSong) { toast('先放一首歌再分享'); return; }
            const url = currentShareURL();
            const label = currentSong.title + (currentSong.artist ? ' - ' + currentSong.artist : '');

            // 手机优先调系统分享（微信/QQ 一栏直达），桌面直接复制
            if (navigator.share && window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
                try {
                    await navigator.share({ title: label, text: '正在听：' + label, url: url });
                    return;
                } catch (e) { /* 用户取消就退回复制 */ }
            }
            const ok = await copyText(url);
            if (ok) toast('🔗 链接已复制，发出去打开就能听');
            else prompt('复制这个链接发给别人：', url);
        }

        // 打开 ?song=&singer= 的分享链接：登录完成后自动播放
        function applyDeepLink() {
            let q;
            try { q = new URLSearchParams(location.search); } catch (e) { return; }
            const song = (q.get('song') || '').trim();
            if (!song) return;
            const singer = (q.get('singer') || '').trim();
            const wantLyrics = q.get('lyrics') === '1';

            // 参数用完就清掉，避免刷新或切标签页时反复触发
            try {
                const keep = q.get('tab');
                history.replaceState(null, '',
                    location.pathname + (keep ? '?tab=' + encodeURIComponent(keep) : ''));
            } catch (e) {}

            playSong({
                title: song,
                artist: singer,
                url: '/stream_live?song=' + encodeURIComponent(song) + '&singer=' + encodeURIComponent(singer)
            }, -1);
            if (wantLyrics) setTimeout(function () { toggleLyrics(true); }, 500);
            toast('🔗 正在播放分享的歌曲：' + song, 2600);
        }

        // —— 歌词纠错 ——
        function updateLyricEditBtn() {
            const btn = document.getElementById('lyricEditBtn');
            if (!btn) return;
            const custom = lastLyricSource === 'custom';
            btn.classList.toggle('is-custom', custom);
            btn.textContent = custom ? '✎ 已自定义' : '✎ 纠错';
        }

        function openLyricEditor() {
            if (!currentSong) { toast('先放一首歌'); return; }
            const modal = document.getElementById('lyricEditorModal');
            const ta = document.getElementById('lyricEditorText');
            const hint = document.getElementById('lyricEditorHint');
            hint.innerHTML = '为《' + escapeLyricHTML(currentSong.title) + '》' +
                (currentSong.artist ? ' · ' + escapeLyricHTML(currentSong.artist) : '') +
                ' 存一版歌词。<br>带 <code>[00:12.34]</code> 时间标签会逐行跟唱；纯文本也能存，按静态滚动显示。' +
                (lastLyricSource === 'custom'
                    ? '<br><b style="color:#E75480">当前是自定义版本</b>，点「恢复自动」可撤销。'
                    : '');
            ta.value = lastLyricLRC || '';
            modal.style.display = 'flex';
            setTimeout(function () { ta.focus(); }, 30);
        }

        function closeLyricEditor() {
            const m = document.getElementById('lyricEditorModal');
            if (m) m.style.display = 'none';
        }

        async function saveLyricEdit() {
            if (!currentSong) return;
            const text = document.getElementById('lyricEditorText').value.trim();
            if (!text) { toast('歌词是空的，想删掉请点「恢复自动」'); return; }
            try {
                const resp = await fetch('/api/lyric/custom', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({
                        song: currentSong.title,
                        singer: currentSong.artist,
                        lrc: text
                    })
                });
                const d = await resp.json().catch(() => ({}));
                if (!resp.ok || !d.success) throw new Error(d.message || ('HTTP ' + resp.status));
                closeLyricEditor();
                toast(d.synced ? '✅ 已保存（带时间轴，逐行跟唱）' : '✅ 已保存（纯文本，静态滚动）', 2400);
                lastLyricSource = 'custom';
                loadLyrics(currentSong);
            } catch (e) {
                toast('保存失败：' + (e && e.message ? e.message : e));
            }
        }

        async function resetLyricEdit() {
            if (!currentSong) return;
            if (!confirm('恢复成自动获取的歌词？你手改的版本会被丢掉。')) return;
            try {
                const qs = new URLSearchParams({ song: currentSong.title, singer: currentSong.artist || '' });
                const resp = await fetch('/api/lyric/custom?' + qs.toString(), {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const d = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(d.message || ('HTTP ' + resp.status));
                closeLyricEditor();
                toast(d.removed ? '↺ 已恢复自动歌词' : '这首歌本来就没有自定义');
                lastLyricSource = '';
                loadLyrics(currentSong);
            } catch (e) {
                toast('操作失败：' + (e && e.message ? e.message : e));
            }
        }

        // —— 键盘快捷键 ——
        const VOL_KEY = 'meow_volume_v1';

        function isTypingTarget(el) {
            if (!el) return false;
            const tag = (el.tagName || '').toUpperCase();
            return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
        }

        function anyModalOpen() {
            const ids = ['queueModal', 'sleepModal', 'lyricEditorModal', 'createPlaylistModal'];
            return ids.some(function (id) {
                const el = document.getElementById(id);
                return el && getComputedStyle(el).display !== 'none';
            });
        }

        function saveVolumeState(audio) {
            try {
                localStorage.setItem(VOL_KEY, JSON.stringify({ v: audio.volume, m: audio.muted }));
            } catch (e) {}
        }

        function restoreVolumeState() {
            const audio = document.getElementById('audioPlayer');
            if (!audio) return;
            try {
                const d = JSON.parse(localStorage.getItem(VOL_KEY) || '{}');
                if (typeof d.v === 'number') audio.volume = Math.max(0, Math.min(1, d.v));
                if (typeof d.m === 'boolean') audio.muted = d.m;
            } catch (e) {}
        }

        function setVolume(v) {
            const audio = document.getElementById('audioPlayer');
            if (!audio) return;
            v = Math.max(0, Math.min(1, v));
            audio.volume = v;
            audio.muted = false;
            saveVolumeState(audio);
            toast('🔊 ' + Math.round(v * 100) + '%', 900);
        }

        document.addEventListener('keydown', function (e) {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (isTypingTarget(e.target)) return;
            const app = document.getElementById('appPage');
            if (!app || app.style.display === 'none') return; // 还在登录页
            if (e.key === 'Escape') {
                closeLyricEditor();
                return;
            }
            if (anyModalOpen()) return;
            const audio = document.getElementById('audioPlayer');
            if (!audio) return;

            switch (e.key) {
                case ' ':
                case 'Spacebar':
                    e.preventDefault();
                    if (audio.paused) audio.play().catch(function () {});
                    else audio.pause();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    audio.currentTime = audio.currentTime + 5;
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    audio.currentTime = Math.max(0, audio.currentTime - 5);
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    setVolume(audio.volume + 0.05);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    setVolume(audio.volume - 0.05);
                    break;
                case 'm':
                case 'M':
                    audio.muted = !audio.muted;
                    saveVolumeState(audio);
                    toast(audio.muted ? '🔇 已静音（按 M 取消）' : '🔊 已取消静音', 1400);
                    break;
                case 'l':
                case 'L':
                    toggleLyrics();
                    break;
                case 'q':
                case 'Q':
                    openQueuePanel();
                    break;
                case 'n':
                case 'N':
                    playNext();
                    break;
                case 'b':
                case 'B':
                    playPrevious();
                    break;
                case '/': {
                    const s = document.getElementById('searchInput');
                    if (s) {
                        e.preventDefault();
                        s.focus();
                        s.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    }
                    break;
                }
                case '?':
                    toast('空格 播放/暂停 · ←→ 快退快进 5 秒 · ↑↓ 音量 · M 静音 · L 歌词 · Q 队列 · N/B 下一首/上一首 · / 搜索', 4200);
                    break;
                default:
                    break;
            }
        });

        document.addEventListener('DOMContentLoaded', function () {
            restoreVolumeState();
            const audio = document.getElementById('audioPlayer');
            if (audio) {
                audio.addEventListener('volumechange', function () { saveVolumeState(audio); });
            }
            // 点遮罩关闭歌词编辑弹窗
            const lm = document.getElementById('lyricEditorModal');
            if (lm) {
                lm.addEventListener('click', function (ev) {
                    if (ev.target === lm) closeLyricEditor();
                });
            }
        });

        /* ================= 初始化：恢复队列 / 深链 / PWA ================= */
        document.addEventListener('DOMContentLoaded', function () {
            restoreQueue();

            // 点关闭按钮 / 点遮罩关闭弹层
            document.querySelectorAll('#queueModal, #sleepModal').forEach(function (m) {
                m.addEventListener('click', function (ev) {
                    if (ev.target === m) m.style.display = 'none';
                });
            });
        });

        // Service Worker：只有在 HTTPS 或 localhost 下浏览器才允许注册。
        // 用 http://局域网IP 访问时会静默跳过 —— 页面功能不受影响，
        // iOS 的「添加到主屏幕」照样可用，只是没有离线缓存。
        if ('serviceWorker' in navigator &&
            (location.protocol === 'https:' || location.hostname === 'localhost' ||
             location.hostname === '127.0.0.1')) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function (e) {
                    console.warn('[PWA] Service Worker 注册失败：', e && e.message);
                });
            });
        }

    </script>
</body>
</html>
