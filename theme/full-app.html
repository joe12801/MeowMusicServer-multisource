<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow Music - 音乐播放器</title>
    <!-- PWA：添加到手机主屏后全屏打开，不显示地址栏 -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#FF69B4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="喵波音律">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            /* 默认粉色主题 */
            --bg-gradient: linear-gradient(-45deg, #ff9a9e, #fad0c4, #ffd1ff, #a18cd1);
            --primary-btn-bg: linear-gradient(45deg, #FFB7C5, #FF69B4);
            --primary-btn-hover: linear-gradient(45deg, #FF69B4, #FFB7C5);
            --text-gradient: linear-gradient(45deg, #FF8FAB, #FF69B4);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: 2px solid white;
            --input-border: #ffe8f5;
            --input-focus: #ff8cc6;
            --shadow-color: rgba(255, 154, 158, 0.3);
            --tab-active-bg: white;
            --tab-active-color: #FF69B4;
            --logo-emoji: '🐱';
            --sparkle-content: '✨';
        }

        [data-theme="blue"] {
            /* 极客蓝主题 */
            --bg-gradient: linear-gradient(-45deg, #4facfe, #00f2fe, #a18cd1, #e0c3fc);
            --primary-btn-bg: linear-gradient(45deg, #4facfe, #00f2fe);
            --primary-btn-hover: linear-gradient(45deg, #00f2fe, #4facfe);
            --text-gradient: linear-gradient(45deg, #4facfe, #00f2fe);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: 1px solid rgba(255, 255, 255, 0.8);
            --input-border: #e0f7fa;
            --input-focus: #4facfe;
            --shadow-color: rgba(66, 153, 225, 0.3);
            --tab-active-bg: white;
            --tab-active-color: #4facfe;
            --logo-emoji: '🎵';
            --sparkle-content: '';
        }

        body {
            font-family: 'Nunito', 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            color: #555;
            overflow-x: hidden;
            /* 默认光标 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23FF69B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>'), auto;
            transition: background 0.5s ease;
        }

        /* 点击爱心特效 - 强制增强 */
        .click-heart {
            position: fixed;
            pointer-events: none;
            font-size: 24px; /*稍微大一点*/
            animation: heartFloat 0.8s ease-out forwards;
            z-index: 2147483647 !important; /* 最大z-index */
            user-select: none;
        }
        
        @keyframes heartFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.5) rotate(15deg); opacity: 0; }
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes heartFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }

        /* 主题切换按钮 */
        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 50%;
            border: 1px solid white;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-size: 24px;
            transition: all 0.3s;
            display: none;
        }
        
        .theme-switch:hover { transform: rotate(30deg) scale(1.1); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            /* 底部播放器是 fixed 的，加了歌词行之后变高，留白要够，
               否则列表最后几首会被遮住 */
            padding-bottom: 280px;
        }
        
        .auth-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .auth-box {
            padding: 50px;
            border-radius: 40px;
            width: 420px;
            position: relative;
            overflow: hidden;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            border: var(--glass-border);
            box-shadow: 0 20px 50px var(--shadow-color);
            transform-style: preserve-3d;
            transition: transform 0.3s;
        }
        
        .auth-box:hover { transform: translateY(-5px) rotateX(2deg); }

        .auth-box h1 {
            text-align: center;
            background: var(--text-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            font-size: 32px;
            font-weight: 900;
            filter: drop-shadow(0 2px 4px rgba(255,182,193,0.5));
        }
        
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px;
            border-radius: 25px;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            color: #999;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .tab.active {
            background: var(--tab-active-bg);
            color: var(--tab-active-color);
            box-shadow: 0 5px 15px var(--shadow-color);
            transform: scale(1.05);
        }
        
        .form { display: none; }
        .form.active { display: block; animation: slideIn 0.4s ease; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px) scale(0.9); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        input {
            width: 100%;
            padding: 18px 25px;
            margin: 12px 0;
            border: 2px solid transparent;
            border-radius: 25px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
            transition: all 0.3s;
            color: #555;
        }

        input:focus {
            outline: none;
            border-color: var(--input-focus);
            background: white;
            box-shadow: 0 0 0 5px var(--shadow-color);
            transform: translateY(-2px);
        }
        
        button.primary {
            width: 100%;
            padding: 18px;
            background: var(--primary-btn-bg);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 10px 25px var(--shadow-color);
            position: relative;
            overflow: hidden;
        }
        
        button.primary::before {
            content: var(--sparkle-content);
            position: absolute;
            left: 20px;
            animation: spin 2s infinite linear;
        }
        
        button.primary::after {
            content: var(--sparkle-content);
            position: absolute;
            right: 20px;
            animation: spin 2s infinite linear reverse;
        }

        button.primary:hover { 
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px var(--shadow-color);
            background: var(--primary-btn-hover);
        }
        
        .message { padding: 15px; border-radius: 20px; margin: 15px 0; text-align: center; font-weight: 600; font-size: 14px; }
        .error { background: #FFF0F0; color: #FF6B6B; border: 2px solid #FFC9C9; }
        .success { background: #F0FFF4; color: #48BB78; border: 2px solid #9AE6B4; }
        .info { background: #EBF8FF; color: #4299E1; border: 2px solid #90CDF4; }
        
        /* 主应用界面 */
        .app-page { display: none; }
        
        .header {
            padding: 20px 30px;
            border-radius: 35px;
            margin-bottom: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: var(--glass-border);
            box-shadow: 0 10px 30px var(--shadow-color);
        }
        
        .logo { 
            font-size: 26px; 
            font-weight: 900; 
            background: var(--text-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo::before {
            content: var(--logo-emoji);
            font-size: 32px;
            -webkit-text-fill-color: initial;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1));
        }
        
        .user-info { display: flex; align-items: center; gap: 20px; }
        
        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s;
        }
        
        .btn-logout {
            background: white;
            color: #FF69B4;
            border: 2px solid #FFE4E1;
            box-shadow: 0 5px 15px var(--shadow-color);
        }
        
        [data-theme="blue"] .btn-logout { color: #4facfe; border-color: #e0f7fa; }
        
        .btn-logout:hover { 
            transform: rotate(5deg) scale(1.05);
        }
        
        .main-content {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(25px);
            border-radius: 45px;
            padding: 40px;
            box-shadow: 0 20px 60px var(--shadow-color);
            border: 2px solid rgba(255, 255, 255, 0.6);
            min-height: 600px;
            position: relative;
        }
        
        .search-box { 
            margin-bottom: 40px; 
            position: relative; 
            z-index: 2;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .search-inputs {
            flex: 1;
            display: flex;
            gap: 12px;
        }
        
        .search-input { 
            flex: 1;
            padding: 18px 25px; 
            border: 2px solid var(--input-border); 
            border-radius: 30px; 
            font-size: 18px; 
            transition: all 0.3s ease;
            background: #fff;
            box-shadow: 0 4px 15px var(--shadow-color);
        }
        
        .search-input:focus { 
            outline: none; 
            border-color: var(--input-focus); 
            box-shadow: 0 5px 20px var(--shadow-color); 
            transform: translateY(-2px);
        }
        
        .search-input::placeholder {
            color: #999;
        }

        /* 结果数自定义框：数字可直接改，也有常用档位快捷按钮 */
        .limit-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            background: #fff;
            border: 2px solid var(--input-border);
            border-radius: 30px;
            box-shadow: 0 4px 15px var(--shadow-color);
            white-space: nowrap;
        }

        .limit-picker label {
            font-size: 13px;
            font-weight: 700;
            color: #999;
        }

        .limit-picker input {
            width: 68px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            font-weight: 800;
            color: var(--tab-active-color, #FF69B4);
            text-align: center;
            padding: 0;
        }

        /* 去掉数字输入框的上下箭头，避免挤占宽度 */
        .limit-picker input::-webkit-outer-spin-button,
        .limit-picker input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .limit-presets {
            display: flex;
            gap: 5px;
        }

        .limit-chip {
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 9px;
            border-radius: 14px;
            background: var(--tab-active-bg, rgba(255, 255, 255, 0.7));
            color: var(--tab-active-color, #FF69B4);
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .limit-chip:hover {
            background: var(--primary-btn-bg);
            color: #fff;
        }

        .limit-chip.active {
            background: var(--primary-btn-bg);
            color: #fff;
            box-shadow: 0 4px 10px var(--shadow-color);
        }

        /* 音源筛选：汽水/YouTube 的曲库和主源不重叠，单独选出来才搜得到 */
        .src-chips {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin: 2px 0 14px;
        }

        .src-chips .lbl {
            font-size: 12px;
            font-weight: 700;
            color: #b98f9f;
            margin-right: 2px;
        }

        /* 音源标记：小小一块色块 logo + 名字，一眼看出这首歌从哪个源来的 */
        .src-tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-left: 7px;
            padding: 1px 6px 1px 4px;
            border-radius: 7px;
            border: 1px solid transparent;
            font-size: 10.5px;
            font-weight: 700;
            line-height: 1.6;
            vertical-align: middle;
            white-space: nowrap;
        }
        .src-tag svg { display: block; flex: none; }

        .ext-hint {
            margin-bottom: 14px;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.65);
            color: #6b7280;
            font-size: 13px;
            line-height: 1.6;
        }

        .search-btn {
            padding: 0 35px;
            border-radius: 35px;
            border: none;
            background: var(--primary-btn-bg);
            color: white;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 10px 20px var(--shadow-color);
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .search-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 15px 30px var(--shadow-color);
            background: var(--primary-btn-hover);
        }
        
        .search-btn:active { transform: scale(0.95); }
        
        .nav-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            justify-content: center;
            background: white;
            padding: 10px;
            border-radius: 35px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 10px 30px var(--shadow-color);
        }
        
        .nav-tab {
            padding: 15px 35px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            color: #999;
            border-radius: 30px;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .nav-tab.active {
            background: var(--primary-btn-bg);
            color: white;
            box-shadow: 0 8px 20px var(--shadow-color);
            transform: translateY(-3px);
        }
        
        .nav-tab:hover:not(.active) { color: #FF69B4; background: #FFF0F5; }
        [data-theme="blue"] .nav-tab:hover:not(.active) { color: #4facfe; background: #e0f7fa; }

        /* ===== 最近播放 / 最常听 ===== */
        .history-head { margin-bottom: 16px; }
        .history-title-row {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        }
        .history-title-row h2 { font-size: 20px; color: var(--text-primary, #444); margin: 0; }
        .history-sub { font-size: 13px; color: #999; margin: 8px 0 12px; }
        .history-switch { display: flex; gap: 8px; }

        /* ===== 播放队列 / 睡眠定时 ===== */
        .queue-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .queue-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 12px;
            background: rgba(255, 255, 255, .72); margin-bottom: 8px;
            border: 1px solid rgba(255, 182, 193, .35);
        }
        .queue-item.playing {
            background: rgba(255, 105, 180, .12);
            border-color: var(--primary-color, #FF69B4);
        }
        .queue-item .q-idx {
            width: 22px; text-align: center; font-size: 12px; color: #bbb; flex: none;
        }
        .queue-item.playing .q-idx { color: var(--primary-color, #FF69B4); font-weight: 700; }
        .queue-item .q-main { flex: 1; min-width: 0; cursor: pointer; }
        .queue-item .q-title {
            font-size: 14px; color: var(--text-primary, #444); font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .queue-item .q-artist {
            font-size: 12px; color: #999;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .queue-item .q-btns { display: flex; gap: 4px; flex: none; }
        .q-btn {
            border: none; background: rgba(255, 240, 245, .9); color: var(--primary-dark, #d6336c);
            width: 28px; height: 28px; border-radius: 9px; cursor: pointer; font-size: 13px;
            line-height: 1; padding: 0;
        }
        .q-btn:hover { background: #ffe0ec; }
        .q-btn.danger { color: #c0392b; }

        .sleep-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .sleep-opt {
            padding: 14px 10px; border-radius: 14px; cursor: pointer; text-align: center;
            background: #fff0f5; color: var(--primary-dark, #d6336c);
            border: 1px solid rgba(255, 182, 193, .5); font-size: 14px; font-weight: 600;
        }
        .sleep-opt:hover { background: #ffe0ec; }
        .sleep-opt.active { background: var(--primary-color, #FF69B4); color: #fff; }
        .sleep-opt small { display: block; font-weight: 400; font-size: 11px; opacity: .75; margin-top: 3px; }
        .sleep-tip { font-size: 12px; color: #999; margin-top: 12px; text-align: center; }

        /* 播放器上的小圆钮（队列 / 睡眠） */
        .player-mini-btn {
            border: none; background: transparent; cursor: pointer; font-size: 15px;
            color: var(--primary-dark, #d6336c); padding: 4px 6px; border-radius: 8px;
            position: relative; line-height: 1;
        }
        .player-mini-btn:hover { background: #FFF0F5; }
        .player-mini-btn.on::after {
            content: ''; position: absolute; top: 2px; right: 2px;
            width: 6px; height: 6px; border-radius: 50%; background: #ff3b6b;
        }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: popUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        @keyframes popUp {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .song-list { display: grid; gap: 20px; }
        
        .song-item {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px 30px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            border: 2px solid transparent;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }
        
        .song-item:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 15px 35px var(--shadow-color);
            border-color: var(--input-focus);
            background: white;
        }
        
        /* 歌曲行右侧的按钮组：上游只在移动端写了样式，桌面端是裸 div，
           四个按钮被挤成一列（搜索结果里特别明显） */
        .song-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
            flex-wrap: nowrap;
        }

        .song-title {
            font-weight: 800;
            font-size: 17px;
            color: #444;
            margin-bottom: 8px;
            display: flex;            align-items: center;
            gap: 12px;
        }

        .song-title::before {
            content: '🎵';
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: #FFF0F5;
            border-radius: 50%;
            font-size: 16px;
            color: #FF69B4;
        }
        [data-theme="blue"] .song-title::before { background: #e0f7fa; color: #4facfe; }
        
        .song-artist {
            color: #999;
            font-size: 14px;
            padding-left: 48px;
            font-weight: 600;
        }
        
        .btn-icon {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-play {
            background: #FFF0F5;
            color: #FF69B4;
        }
        [data-theme="blue"] .btn-play { background: #e0f7fa; color: #4facfe; }
        
        .btn-play:hover { 
            background: var(--primary-btn-bg);
            color: white;
            transform: scale(1.1);
            box-shadow: 0 8px 20px var(--shadow-color);
        }
        
        .btn-add {
            background: #F0FFF4;
            color: #48BB78;
        }
        
        .btn-add:hover { 
            background: #48BB78;
            color: white;
            transform: scale(1.1) rotate(5deg);
        }
        
        .btn-remove {
            background: #FFF5F5;
            color: #F56565;
        }
        
        .btn-remove:hover { 
            background: #F56565;
            color: white;
            transform: scale(1.1) rotate(-5deg);
        }
        
        /* 悬浮胶囊播放器 Pro Max */
        .player {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 15px 35px;
            box-shadow: 0 25px 70px var(--shadow-color);
            display: none;
            border-radius: 60px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            z-index: 1000;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .player:hover {
            transform: translateX(-50%) translateY(-5px);
            box-shadow: 0 35px 80px var(--shadow-color);
            background: rgba(255, 255, 255, 0.95);
        }
        
        .player.active { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 25px; animation: floatIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        @keyframes floatIn {
            from { transform: translate(-50%, 150px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        
        .player-info {
            display: flex;
            /* 原来这里是 column，导致「顺序 / ☰ / 🌙 / 🔗」四个按钮竖着排到歌名下面，
               把整个胶囊播放器撑得又高又空 —— 改成一行，歌名在左、按钮在右 */
            flex-direction: row;
            align-items: center;
            gap: 4px;
            min-width: 160px;
            border: none;
            margin: 0;
            padding: 0;
        }
        
        .player-title { font-size: 16px; color: #333; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
        .player-artist { font-size: 13px; color: var(--primary-dark); }
        
        .player-controls {
            margin: 0;
            flex: 1;
            /* 原来只是个普通块，audio 又是 width:100%，
               结果上一首/下一首被挤到控制条上下两行去 */
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 240px;
        }

        .player-controls audio {
            flex: 1 1 auto;
            width: auto;
            min-width: 0;
        }

        /* 用 id 提权，压过后面的 .player audio{width:100%}，否则原生控件会被压成一个小方块 */
        #audioPlayer {
            flex: 1 1 260px;
            width: auto;
            min-width: 260px;
        }
        
        .player audio { 
            height: 45px; 
            border-radius: 25px; 
            width: 100%; 
            filter: drop-shadow(0 5px 10px rgba(255, 182, 193, 0.2));
        }

        /* 播放器里的当前歌词（独占一行，点击展开完整歌词） */
        .player-lyrics {
            flex: 0 0 100%;
            order: 5;
            display: none;
            width: 100%;
            padding: 2px 8px 0;
            text-align: center;
            cursor: pointer;
            line-height: 1.35;
            overflow: hidden;
        }

        .player-lyrics.visible { display: block; }

        .player-lyrics .pl-text {
            font-size: 14px;
            font-weight: 700;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.25s;
        }

        .player-lyrics .pl-trans {
            font-size: 11.5px;
            color: #a0a0ac;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .player-lyrics:hover .pl-text { color: var(--primary-dark); }
        .player-lyrics.no-lyric .pl-text { font-weight: 600; color: #aaa; font-size: 13px; }

        /* 音乐律动波纹 */
        .music-waves {
            display: flex;
            align-items: flex-end;
            height: 30px;
            gap: 3px;
            margin-right: 10px;
        }

        .wave-bar {
            width: 4px;
            background: linear-gradient(to top, #FFB7C5, #FF69B4);
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 20px; animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { height: 15px; animation-delay: 0.3s; }
        .wave-bar:nth-child(4) { height: 25px; animation-delay: 0.4s; }
        
        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.5); }
        }

        /* 旋转唱片 */
        .vinyl-record {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #333;
            background-image: repeating-radial-gradient(#333 0, #333 2px, #444 3px, #444 4px);
            border: 2px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 4s linear infinite;
            animation-play-state: paused; /* 默认暂停 */
        }

        .vinyl-record.playing { animation-play-state: running; }

        .vinyl-record::after {
            content: '';
            width: 16px;
            height: 16px;
            background: var(--primary-color);
            border-radius: 50%;
            border: 4px solid white;
        }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .playlist-item {
            background: white;
            padding: 30px;
            border-radius: 35px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.4s;
            border: 3px solid transparent;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            gap: 25px;
            position: relative;
            overflow: hidden;
        }
        
        .playlist-item::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.5), transparent);
            transform: translateX(-100%);
            transition: 0.5s;
        }

        .playlist-item::before {
            content: '📂';
            font-size: 36px;
            background: #FFF0F5;
            padding: 20px;
            border-radius: 25px;
            box-shadow: inset 0 0 10px rgba(255, 182, 193, 0.2);
        }
        
        .playlist-item:hover {
            transform: scale(1.03) translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 20px 50px rgba(255, 182, 193, 0.25);
        }
        
        .playlist-item:hover::after { transform: translateX(100%); }

        .playlist-name { font-size: 20px; font-weight: 800; color: #444; margin-bottom: 5px; }
        .playlist-count { color: #999; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 5px; }

        /* 歌单展开/收缩 */
        .playlist-card { margin-bottom: 20px; }
        .playlist-card .playlist-item { margin-bottom: 0; }
        .playlist-card.expanded .playlist-item {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            border-color: var(--primary-color, #f5576c);
        }
        .playlist-toggle {
            margin-left: auto;
            font-size: 18px;
            color: #ccc;
            transition: transform 0.3s, color 0.3s;
            padding: 0 5px;
        }
        .playlist-card.expanded .playlist-toggle { color: var(--primary-color, #f5576c); }
        .playlist-songs {
            display: none;
            background: rgba(255,255,255,0.92);
            border: 3px solid var(--primary-color, #f5576c);
            border-top: none;
            border-radius: 0 0 35px 35px;
            padding: 5px 25px 25px 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.06);
        }
        .playlist-card.expanded .playlist-songs { display: block; }
        .playlist-songs-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0 18px; }
        .playlist-songs-toolbar .btn-icon { padding: 10px 20px; }
        .playlist-songs-toolbar .toolbar-spacer { margin-left: auto; }
        .playlist-songs .song-list { gap: 12px; }
        .playlist-songs .song-item { padding: 14px 20px; border-radius: 20px; }
        .playlist-songs-empty { color: #999; text-align: center; padding: 25px 10px; font-size: 15px; }
        
        /* 歌词显示区域 */
        .lyrics-container {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 350px;
            max-height: 70vh;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(30px);
            border-radius: 35px;
            padding: 30px 20px;
            box-shadow: 0 20px 60px rgba(255, 182, 193, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.9);
            overflow: hidden;
            display: none;
            z-index: 999;
        }

        .lyrics-container.active { display: block; animation: slideInRight 0.5s ease; }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateY(-50%) translateX(50px); }
            to { opacity: 1; transform: translateY(-50%) translateX(0); }
        }

        .lyrics-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 182, 193, 0.3);
            position: relative;
        }

        /* 歌词纠错入口：小、不抢戏，但随时点得到 */
        .lyric-edit {
            position: absolute;
            right: 0;
            bottom: 6px;
            border: 1px solid rgba(255, 143, 171, 0.5);
            background: rgba(255, 240, 245, 0.9);
            color: #E75480;
            font-size: 11px;
            padding: 3px 9px;
            border-radius: 999px;
            cursor: pointer;
            transition: all .2s;
        }
        .lyric-edit:hover { background: #FFE4E1; }
        .lyric-edit.is-custom {
            background: #FF8FAB;
            color: #fff;
            border-color: #FF8FAB;
        }

        .lyrics-title {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(45deg, #FF8FAB, #FF69B4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .lyrics-artist {
            font-size: 14px;
            color: #999;
            font-weight: 600;
        }

        .lyrics-content {
            height: calc(70vh - 120px);
            overflow-y: auto;
            padding: 10px;
            scroll-behavior: smooth;
        }

        .lyrics-content::-webkit-scrollbar { width: 4px; }
        .lyrics-content::-webkit-scrollbar-track { background: rgba(255, 182, 193, 0.1); border-radius: 10px; }
        .lyrics-content::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }

        .lyric-line {
            text-align: center;
            padding: 12px 10px;
            font-size: 16px;
            color: #999;
            transition: all 0.3s;
            cursor: pointer;
            border-radius: 15px;
            font-weight: 600;
            line-height: 1.6;
        }

        .lyric-line:hover {
            background: rgba(255, 182, 193, 0.1);
            color: #666;
        }

        .lyric-line.active {
            font-size: 20px;
            color: var(--primary-dark);
            font-weight: 800;
            background: rgba(255, 182, 193, 0.15);
            transform: scale(1.05);
        }

        .lyric-line.passed {
            color: #ccc;
        }

        .no-lyrics {
            text-align: center;
            color: #999;
            padding: 50px 20px;
            font-size: 14px;
        }

        /* 翻译行：显示在原文下方，字小一号、颜色更淡 */
        .lyric-trans {
            display: block;
            margin-top: 4px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
            color: rgba(130, 130, 145, 0.95);
        }

        .lyric-line.active .lyric-trans {
            color: rgba(80, 80, 95, 0.9);
        }

        .lyrics-close {
            position: absolute;
            right: 16px;
            top: 14px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: rgba(255, 182, 193, 0.35);
            color: #c2185b;
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .lyrics-close:hover {
            background: rgba(255, 105, 180, 0.45);
            transform: scale(1.08);
        }

        .lyrics-empty-link {
            display: inline-block;
            margin-top: 14px;
            color: var(--primary-dark);
            font-weight: 700;
            text-decoration: none;
        }

        .lyrics-empty-link:hover { text-decoration: underline; }

        .lyrics-toggle {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: linear-gradient(45deg, #FFB7C5, #FF69B4);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
            transition: all 0.3s;
            z-index: 998;
            border: 3px solid white;
        }

        .lyrics-toggle.active { display: flex; }

        .lyrics-toggle:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.5);
        }

        /* 📱 移动端适配媒体查询 */
        /* 通用弹窗：上游只写了 .modal-content，缺 .modal 本体，
           结果「创建歌单」弹窗一直摊在页面最底部（真 bug，顺手补上） */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2400;
            background: rgba(0, 0, 0, 0.45);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .modal-title {
            font-size: 17px;
            font-weight: 800;
            color: #E75480;
            text-align: center;
            margin-bottom: 16px;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 14px; }
        .modal-buttons .btn-cancel,
        .modal-buttons .btn-confirm {
            flex: 1;
            border: none;
            border-radius: 16px;
            padding: 12px 0;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .modal-buttons .btn-cancel { background: #f3f3f3; color: #777; }
        .modal-buttons .btn-confirm { background: linear-gradient(45deg, #FF8FAB, #FF69B4); color: #fff; }

        @media screen and (max-width: 768px) {
            /* 容器调整 */
            .container { 
                padding: 10px; 
                width: 100%;
                overflow-x: hidden;
            }

            /* 登录框适配 */
            .auth-box { 
                width: 90%; 
                padding: 30px 20px;
                margin: 0 auto;
            }
            
            .auth-box h1 { font-size: 26px; }

            /* 头部调整 */
            .header { 
                flex-direction: row;
                padding: 15px;
                margin-bottom: 20px;
                border-radius: 25px;
            }
            
            .logo { font-size: 20px; }
            .logo::before { font-size: 24px; }
            
            .user-info span { display: none; } /* 手机端隐藏用户名，只留退出按钮 */

            /* 主内容区域 */
            .main-content { 
                padding: 20px 15px; 
                border-radius: 30px;

            }

            /* 搜索框 */
            .search-box {
                flex-direction: column;
                gap: 10px;
            }
            
            .search-inputs {
                flex-direction: column;
                width: 100%;
                gap: 10px;
            }
            
            .search-input { 
                padding: 15px 20px; 
                font-size: 16px;
                width: 100%;
            }
            
            .search-btn {
                width: 100%;
                padding: 15px;
                font-size: 16px;
                border-radius: 25px;
            }

            /* 结果数控件在窄屏占满一行、内部可换行 */
            .limit-picker {

            .nav-tabs {

            }
            
            .nav-tabs::-webkit-scrollbar { display: none; } /* 隐藏滚动条 */

            }

            /* 歌曲列表 */
            .song-item {

            .song-info { width: 100%; }
            
            .song-actions {

                border-radius: 30px;
                justify-content: space-between;

            .vinyl-record { 
                width: 40px; 
                height: 40px; 
                border-width: 1px;
            }

            /* 播放器信息区域 */
            .player-info { 
                flex: 1;
                min-width: 0; /* 防止溢出 */
                margin-right: 5px;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }

            .player-title { 
                font-size: 14px; 
                max-width: 100px; 
            }
            
            .player-artist { font-size: 12px; }

            /* 播放器控制区域 */
            .player-controls { 
                width: 100%;
                flex: 0 0 100%; /* 强制占满一行 */
                order: 3; /* 换行显示 */
                margin-top: 10px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            /* 音频控件调整 */
            .player audio { 
                height: 40px; 
                width: 100%;
                margin: 0 10px;
            }
            
            /* 隐藏不重要的元素 */
            #playModeBtn { font-size: 12px; padding: 5px; }

            /* 模态框适配 */
            .modal-content {
                width: 92%;
                max-width: 420px;
                margin: 0;
                padding: 20px;
            }

            /* 歌词区域移动端适配 */

                position: fixed;

                left: 0;

                max-height: 50vh;
                border-radius: 30px 30px 0 0;
                padding: 20px 15px;
            }

            .lyrics-container.active {
                animation: slideInUp 0.4s ease;
            }

            @keyframes slideInUp {
                from { transform: translateY(100%); }
                to { transform: translateY(0); }
            }

            .lyrics-content {
                height: calc(50vh - 100px);
            }

            .lyrics-toggle {

        /* 设备管理样式 */
        .device-form {
            background: rgba(255, 255, 255, 0.8);
            padding: 25px;
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .status-online { background: #F0FFF4; color: #48BB78; }
        .status-offline { background: #FFF5F5; color: #F56565; }

    <script>
        // 变量声明必须在最前面
        let token = localStorage.getItem('token');
        let currentUser = null;
        let currentSong = null;
        let playlists = [];
        let currentPlaylist = null;
        let playMode = 'list'; // 'list'=顺序 | 'single'=单曲循环 | 'random'=随机 | 'loop'=列表循环
        let currentSongList = [];
        let currentIndex = 0;
        let currentSearchResults = []; // 当前搜索结果，供"一键加入歌单"使用
        let lyricsData = []; // 存储解析后的歌词数据
        let currentLyricIndex = -1; // 当前歌词行索引
        let lastLyricLRC = ''; // 当前这首歌的原始 LRC（纠错时预填）
        let lastLyricSource = ''; // 歌词来源，custom=人工覆盖过
        
        // 主题管理
        let currentTheme = localStorage.getItem('theme') || 'pink';
        
        // 初始化检查
        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();
            initSearchLimit();
            if (token) {
                checkAuth();
            } else {
                showAuthPage();
            }
        });

        function toggleTheme() {
            currentTheme = currentTheme === 'pink' ? 'blue' : 'pink';
            localStorage.setItem('theme', currentTheme);
            applyTheme();
        }
        
        function applyTheme() {
            const body = document.body;
            const switchBtn = document.querySelector('.theme-switch');
            
            if (currentTheme === 'blue') {
                body.setAttribute('data-theme', 'blue');
                if(switchBtn) switchBtn.textContent = '💻';
            } else {
                body.removeAttribute('data-theme');
                if(switchBtn) switchBtn.textContent = '🎨';
            }
        }

        // 魔法光标特效 - 高密度流畅版
        document.addEventListener('mousemove', function(e) {
            // 几乎不丢弃，保证流畅性 (只丢弃10%以防浏览器卡顿，之前是丢弃50%)
            if (Math.random() > 0.9) return; 
            
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            
            // 随机大小
            const size = Math.random() * 6 + 3; // 稍微大一点点
            
            // 随机扩散方向
            const tx = (Math.random() - 0.5) * 60;
            const ty = (Math.random() - 0.5) * 60;
            
            // 随机颜色 (白色为主，偶尔出现粉色/蓝色)
            const colors = ['#FFF', '#FFF', '#FFF', '#FFB7C5', '#87CEEB'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;
            sparkle.style.left = `${e.clientX}px`;
            sparkle.style.top = `${e.clientY}px`;
            sparkle.style.backgroundColor = color; // 应用颜色
            sparkle.style.setProperty('--tx', `${tx}px`);
            sparkle.style.setProperty('--ty', `${ty}px`);
            
            document.body.appendChild(sparkle);
            
            setTimeout(() => sparkle.remove(), 1000);
        });

        // 点击爱心特效 - 强制启用
        document.addEventListener('click', function(e) {
            // 不再判断主题，强制显示
            // 也不判断点击目标，全屏有效
            
            const heart = document.createElement('div');
            heart.classList.add('click-heart');
            heart.innerHTML = ['💖', '✨', '🌸', '🎀'][Math.floor(Math.random() * 4)];
            heart.style.left = `${e.clientX}px`;
            heart.style.top = `${e.clientY}px`;
            
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1000);
        });

        // 控制播放动画

        // 认证相关
        function switchAuthTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            clearAuthMessage();
        }

        function showAuthMessage(msg, type) {
            const msgDiv = document.getElementById('authMessage');
            msgDiv.innerHTML = `<div class="message ${type}">${msg}</div>`;
        }

        function clearAuthMessage() {
            document.getElementById('authMessage').innerHTML = '';
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            showAuthMessage('注册中...', 'info');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    token = result.token;
                    localStorage.setItem('token', token);
                    currentUser = result.user;
                    showAuthMessage('注册成功！', 'success');
                    setTimeout(() => showAppPage(), 1000);
                } else {
                    showAuthMessage(result.error || '注册失败', 'error');
                }
            } catch (error) {
                showAuthMessage('网络错误: ' + error.message, 'error');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            showAuthMessage('登录中...', 'info');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    token = result.token;
                    localStorage.setItem('token', token);
                    currentUser = result.user;
                    showAuthMessage('登录成功！', 'success');
                    setTimeout(() => showAppPage(), 1000);
                } else {
                    showAuthMessage(result.error || '登录失败', 'error');
                }
            } catch (error) {
                showAuthMessage('网络错误: ' + error.message, 'error');
            }
        }

        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    currentUser = await response.json();
                    showAppPage();
                } else {
                    localStorage.removeItem('token');
                    token = null;
                    showAuthPage();
                }
            } catch (error) {
                showAuthPage();
            }
        }

        function handleLogout() {
            localStorage.removeItem('token');
            token = null;
            currentUser = null;
            showAuthPage();
            
            // 退出登录时，隐藏主题切换按钮，并强制恢复粉色主题
            const switchBtnLogout = document.querySelector('.theme-switch');
            if (switchBtnLogout) switchBtnLogout.style.display = 'none';
            if (currentTheme === 'blue') {
                document.body.removeAttribute('data-theme'); // 强制移除蓝色主题属性
                // 恢复粉色系特效
                document.body.style.cursor = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23FF69B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>'), auto`;
            }
        }

        function showAuthPage() {
            document.getElementById('authPage').style.display = 'flex';
            document.getElementById('appPage').style.display = 'none';
        }

        function showAppPage() {
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('appPage').style.display = 'block';
            const usernameEl = document.getElementById('username');
            if (usernameEl && currentUser) usernameEl.textContent = currentUser.username || '';
            
            // 登录成功后显示主题切换按钮，并应用用户保存的主题
            const switchBtnShow = document.querySelector('.theme-switch');
            if (switchBtnShow) switchBtnShow.style.display = 'block';
            applyTheme(); // 重新应用用户的主题设置

            loadPlaylists();

            // 从主屏快捷方式（?tab=history）进来，或登录前就停在「最近」页：
            // 登录完成后补一次数据加载，否则会一直显示「登录后才会记录」
            try {
                const want = new URLSearchParams(location.search).get('tab');
                if (want && document.getElementById(want + 'Tab')) {
                    switchTab(want);
                } else {
                    const active = document.querySelector('.nav-tab.active');
                    if (active && active.dataset.tab === 'history') loadHistory();
                }
            } catch (e) {}

            // 从分享链接（?song=&singer=）进来，登录完成后直接播放
            applyDeepLink();
        }

        // 标签切换
        function switchTab(tab) {
            // 按 data-tab 匹配，不再依赖按钮顺序（加标签页时不用改这里）
            document.querySelectorAll('.nav-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

            const el = document.getElementById(tab + 'Tab');
            if (el) el.classList.add('active');

            if (tab === 'favorite') loadFavorites();
            else if (tab === 'playlists') loadPlaylists();
            else if (tab === 'devices') loadDevices();
            else if (tab === 'history') loadHistory();
        }

        // 设备管理功能
        async function loadDevices() {
            const listDiv = document.getElementById('devicesList');
            listDiv.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const response = await fetch('/api/device/list', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                
                if (data.success && data.devices && data.devices.length > 0) {
                    const html = data.devices.map(device => `
                        <div class="device-item">
                            <div class="device-info">
                                <div class="device-name">${device.device_name || 'ESP32音乐播放器'}</div>

                                <span class="device-status ${device.is_active ? 'status-online' : 'status-offline'}">

                                </span>
                                <button class="btn-icon btn-remove" style="margin-left: 15px;" onclick="unbindDevice('${device.mac}')">解绑</button>

        async function bindDevice() {
            const macInput = document.getElementById('bindMac');
            const nameInput = document.getElementById('bindName');
            const mac = formatMac(macInput.value.trim());
            const name = nameInput.value.trim();
            
            if (!mac) {
                alert('请输入MAC地址');
                return;
            }
            
            try {
                const response = await fetch('/api/device/bind-direct', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ mac: mac, device_name: name })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    alert('✅ 绑定成功！');
                    macInput.value = '';
                    nameInput.value = '';
                    loadDevices();
                } else {
                    alert('❌ 绑定失败: ' + (data.message || '未知错误'));
                }
            } catch (error) {
                alert('❌ 网络错误: ' + error.message);
            }
        }

        async function unbindDevice(mac) {
            if (!confirm('确定要解绑此设备吗？')) return;
            
            try {
                const response = await fetch('/api/device/unbind', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ mac: mac })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    alert('✅ 解绑成功');
                    loadDevices();
                } else {
                    alert('❌ 解绑失败: ' + (data.message || '未知错误'));
                }
            } catch (error) {
                alert('❌ 网络错误: ' + error.message);
            }
        }

        function formatMac(mac) {
            // 移除所有非十六进制字符
            let cleaned = mac.replace(/[^A-Fa-f0-9]/g, '');
            // 如果长度不是12，返回原值让后端处理或报错
            if (cleaned.length !== 12) return mac;
            // 格式化为 AA:BB:CC:DD:EE:FF
            return cleaned.match(/.{2}/g).join(':').toUpperCase();
        }
        
        // MAC输入框自动格式化
        document.getElementById('bindMac').addEventListener('input', function(e) {
            const val = e.target.value.replace(/[^A-Fa-f0-9]/g, '');
            if (val.length === 12 && !e.target.value.includes(':')) {
                e.target.value = formatMac(val);
            }
        });

        // 搜索
        function handleSearchKeypress(e) {
            if (e.key === 'Enter') {
                searchMusic();
            }
        }

        // ===== 结果数设置（可手动指定，按浏览器记住） =====
        const SEARCH_LIMIT_KEY = 'meow_search_limit';
        const SEARCH_LIMIT_DEFAULT = 50;
        const SEARCH_LIMIT_MAX = 500;

        function clampSearchLimit(v) {
            let n = parseInt(v, 10);
            if (isNaN(n) || n <= 0) n = SEARCH_LIMIT_DEFAULT;
            if (n > SEARCH_LIMIT_MAX) n = SEARCH_LIMIT_MAX;
            return n;
        }

        function getSearchLimit() {
            const el = document.getElementById('limitInput');
            return clampSearchLimit(el ? el.value : SEARCH_LIMIT_DEFAULT);
        }

        function highlightLimitChip() {
            const cur = getSearchLimit();
            document.querySelectorAll('.limit-chip').forEach(chip => {
                chip.classList.toggle('active', parseInt(chip.dataset.limit, 10) === cur);
            });
        }

        function applySearchLimit(n) {
            const el = document.getElementById('limitInput');
            if (el) el.value = clampSearchLimit(n);
            highlightLimitChip();
        }

        // 点档位按钮：填数字 + 记住
        function setSearchLimit(n) {
            applySearchLimit(n);
            saveSearchLimit();
        }

        // 手改输入框后同步记忆（change 事件触发）
        function saveSearchLimit() {
            const n = getSearchLimit();
            applySearchLimit(n);
            try { localStorage.setItem(SEARCH_LIMIT_KEY, String(n)); } catch (e) {}
        }

        function initSearchLimit() {
            let saved = null;
            try { saved = localStorage.getItem(SEARCH_LIMIT_KEY); } catch (e) {}
            applySearchLimit(saved ? saved : SEARCH_LIMIT_DEFAULT);
        }

        /* 音源筛选：'' = 全部（多源回退），其余值只搜该源 */
        let searchSource = '';

        (function initSrcChips() {
            const box = document.getElementById('srcChips');
            if (!box) return;
            box.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-src]');
                if (!btn) return;
                searchSource = btn.getAttribute('data-src') || '';
                box.querySelectorAll('.limit-chip').forEach(b => b.classList.toggle('active', b === btn));
                const q = document.getElementById('searchInput').value.trim();
                const a = document.getElementById('artistInput').value.trim();
                if (q || a) searchMusic();
            });
            // 汽水被地域风控时（本机在境外），按钮点了也是空结果，直接收起来
            detectQishui();
        })();

        async function detectQishui() {
            if (typeof token === 'undefined' || !token) return;
            try {
                const r = await fetch('/api/qishui/status', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!r.ok) return;
                const d = await r.json();
                const chip = document.querySelector('#srcChips [data-src="qishui"]');
                if (!chip) return;
                if (d.usable) {
                    chip.title = d.searchable
                        ? '汽水音乐（抖音曲库）'
                        : '汽水音乐：未登录，只能搜到榜单里的歌（去 /tools 扫码解锁全库）';
                    return;
                }
                chip.remove();
                if (searchSource === 'qishui') {
                    searchSource = '';
                    const all = document.querySelector('#srcChips [data-src=""]');
                    if (all) all.classList.add('active');
                }
            } catch (e) { /* 探测失败就保留按钮，不影响其他源 */ }
        }

        async function searchMusic() {
            const query = document.getElementById('searchInput').value.trim();
            const artist = document.getElementById('artistInput').value.trim();

            // 歌名、歌手至少填一个；只填歌手时按歌手搜出它的所有歌
            if (!query && !artist) {
                alert('请输入歌曲名称或歌手');
                return;
            }

            const limit = getSearchLimit();
            saveSearchLimit();

            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = `<div class="loading">🔍 搜索中...（最多 ${limit} 首）</div>`;

            try {
                let url = `/api/search?query=${encodeURIComponent(query)}&limit=${limit}`;
                if (artist) url += `&artist=${encodeURIComponent(artist)}`;
                if (searchSource) url += `&source=${encodeURIComponent(searchSource)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.length > 0) {
                    currentSearchResults = data; // 保存供"一键加入歌单"
                    displaySearchResults(data, limit);
                } else {
                    currentSearchResults = [];
                    resultsDiv.innerHTML = '<div class="empty-state">未找到结果</div>';
                }
            } catch (error) {
                console.error('搜索失败:', error);
                resultsDiv.innerHTML = '<div class="empty-state">搜索失败，请重试</div>';
            }
        }

        function displaySearchResults(songs, limit) {
            const hitLimit = limit && songs.length >= limit;
            const extCount = songs.filter(s => s.source === 'ext').length;
            const bulkBar = `
                <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                    <span style="font-size: 13px; color: var(--text-secondary, #888);">共 ${songs.length} 首${hitLimit ? '（已达设定的结果数上限）' : ''}</span>
                    <button class="btn-icon" onclick="addAllToPlaylist()" style="background: linear-gradient(135deg,#f093fb,#f5576c); color: #fff; padding: 9px 18px; border: none; border-radius: 20px; cursor: pointer; font-weight: 600;">
                        ➕ 一键加入歌单
                    </button>
                    ${hitLimit ? '<button class="btn-icon" onclick="setSearchLimit(500); searchMusic()" style="background: rgba(255,255,255,.8); color: var(--tab-active-color,#FF69B4); padding: 9px 16px; border: none; border-radius: 20px; cursor: pointer; font-weight: 600;">显示更多（500）</button>' : ''}
                </div>
                ${extCount ? `<div class="ext-hint">🌐 其中 ${extCount} 首来自外部源（YouTube），是国内的补充：被下架/被禁的歌只有这里有。首次播放要下载转码，等 10~20 秒是正常的。</div>` : ''}`;
            const html = bulkBar + '<div class="song-list">' + songs.map((song, idx) => `
                <div class="song-item">
                    <div class="song-info">
                        <div class="song-title">${song.title || '未知歌曲'}${srcBadge(song.source)}</div>
                        <div class="song-artist">${song.artist || '未知艺术家'}</div>
                    </div>
                    <div class="song-actions">
                        <button class="btn-icon btn-play" onclick='playSong(${JSON.stringify(song)})'>播放</button>
                        <a class="btn-icon" href="/lyrics?song=${encodeURIComponent(song.title || '')}&singer=${encodeURIComponent(song.artist || '')}" target="_blank" rel="noopener" title="查看歌词" style="padding:6px 10px;">歌词</a>
                        <button class="btn-icon btn-add" onclick='addToFavorite(${JSON.stringify(song)})'>喜欢</button>
                        <button class="btn-icon" onclick='addOneToPlaylist(${idx})' title="加入歌单" style="padding:6px 10px;">歌单</button>
                    </div>
                </div>
            `).join('') + '</div>';

            document.getElementById('searchResults').innerHTML = html;
        }

        // ===== 搜索结果批量加入歌单 =====
        // 打开歌单选择弹窗；mode='all' 加入全部，mode='one' 加入单首(index)
        let pendingAddMode = 'all';
        let pendingAddIndex = -1;
        async function openAddToPlaylistModal(mode, index) {
            if (!token) { alert('请先登录'); return; }
            pendingAddMode = mode;
            pendingAddIndex = index || 0;
            const modal = document.getElementById('addToPlaylistModal');
            const list = document.getElementById('addToPlaylistList');
            list.innerHTML = '<div class="loading">加载歌单...</div>';
            modal.style.display = 'flex';
            try {
                const resp = await fetch('/api/user/playlists', { headers: { 'Authorization': 'Bearer ' + token } });
                const pls = await resp.json();
                const songs = pendingAddMode === 'all' ? currentSearchResults : [currentSearchResults[pendingAddIndex]];
                const title = document.getElementById('addToPlaylistTitle');
                if (title) title.textContent = pendingAddMode === 'all'
                    ? `将 ${songs.length} 首歌加入歌单`
                    : `将《${songs[0] ? songs[0].title : ''}》加入歌单`;
                if (pls && pls.length > 0) {
                    list.innerHTML = pls.map(pl => `
                        <div class="playlist-item" onclick='confirmAddToPlaylist("${pl.id}")'>
                            <div class="playlist-name">${pl.name}</div>
                            <div class="playlist-count">${pl.songs ? pl.songs.length : 0} 首歌曲 · 点击加入</div>
                        </div>`).join('') + `
                        <div class="playlist-item" onclick="showQuickCreateAndAdd()" style="border:1px dashed var(--primary-color,#f5576c);">
                            <div class="playlist-name" style="color:var(--primary-color,#f5576c);">＋ 新建歌单并加入</div>
                        </div>`;
                } else {
                    list.innerHTML = `<div class="empty-state">还没有歌单，先新建一个吧</div>
                        <div class="playlist-item" onclick="showQuickCreateAndAdd()" style="border:1px dashed var(--primary-color,#f5576c);">
                            <div class="playlist-name" style="color:var(--primary-color,#f5576c);">＋ 新建歌单并加入</div>
                        </div>`;
                }
            } catch (e) {
                list.innerHTML = '<div class="empty-state">加载失败：' + e.message + '</div>';
            }
        }
        function addAllToPlaylist() { openAddToPlaylistModal('all', -1); }
        function addOneToPlaylist(index) { openAddToPlaylistModal('one', index); }
        function closeAddToPlaylistModal() {
            const m = document.getElementById('addToPlaylistModal');
            if (m) m.style.display = 'none';
        }
        function showQuickCreateAndAdd() {
            const name = prompt('新歌单名称：');
            if (name && name.trim()) {
                createPlaylistThenAdd(name.trim());
            }
        }
        async function createPlaylistThenAdd(name) {
            try {
                const resp = await fetch('/api/user/playlists/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ name, description: '' })
                });
                if (resp.ok) {
                    const pl = await resp.json();
                    await confirmAddToPlaylist(pl.id);
                } else { alert('创建歌单失败'); }
            } catch (e) { alert('创建歌单失败：' + e.message); }
        }
        async function confirmAddToPlaylist(playlistId) {
            const songs = pendingAddMode === 'all' ? currentSearchResults : [currentSearchResults[pendingAddIndex]];
            if (!songs || songs.length === 0) { alert('没有可加入的歌曲'); return; }
            const btn = document.getElementById('addToPlaylistList');
            if (btn) btn.innerHTML = '<div class="loading">正在加入 0/' + songs.length + '...</div>';
            let ok = 0, fail = 0, done = 0;
            // 服务端会把新收进的歌插到歌单最前面，所以批量添加要从最后一首往回提交，
            // 这样整批加完后顺序和搜索结果一致，且整批都排在歌单最前面。
            for (let si = songs.length - 1; si >= 0; si--) {
                const s = songs[si];
                const title = s.title || s.Title || '';
                const artist = s.artist || s.Artist || '';
                const rawUrl = s.url || s.link || s.audio_url || s.audio_full_url ||
                    s.AudioURL || s.AudioFullURL || s.URL ||
                    `/stream_live?song=${encodeURIComponent(title)}&singer=${encodeURIComponent(artist)}`;
                const songData = {
                    title, artist,
                    source: s.source || s.Source || '',
                    audio_url: rawUrl,
                    audio_full_url: rawUrl,
                    m3u8_url: s.m3u8_url || '',
                    lyric_url: s.lyric_url || '',
                    cover_url: s.cover_url || '',
                    duration: s.duration || 0
                };
                try {
                    const r = await fetch(`/api/user/playlists/add-song?playlist_id=${encodeURIComponent(playlistId)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify(songData)
                    });
                    if (r.ok) ok++; else fail++;
                } catch (e) { fail++; }
                done++;
                // 大歌单几百首时给个进度，避免看起来像卡死
                if (btn && (done % 5 === 0 || done === songs.length)) {
                    btn.innerHTML = '<div class="loading">正在加入 ' + done + '/' + songs.length + '...</div>';
                }
            }
            closeAddToPlaylistModal();
            alert(`加入完成：成功 ${ok} 首${fail ? '，失败 ' + fail + ' 首（可能歌单里已存在）' : ''}`);
        }

        // 播放相关
        function playSong(song, index = -1) {
            console.log('====== 播放歌曲 ======');
            console.log('原始歌曲对象:', song);
            console.log('所有字段:', Object.keys(song));
            
            // 规范化歌曲对象（支持多种命名格式）
            const normalizedSong = {
                title: song.title || song.Title || '未知歌曲',
                artist: song.artist || song.Artist || '未知艺术家',
                url: song.url || song.link || song.audio_url || song.audio_full_url || 
                     song.AudioURL || song.AudioFullURL || song.URL || '',
                lyric_url: song.lyric_url || song.LyricURL || song.lyricUrl || '',
                cover_url: song.cover_url || song.CoverURL || song.coverUrl || '',
                source: song.source || song.Source || '',
                duration: song.duration || song.Duration || 0
            };
            
            console.log('规范化后的歌曲:', normalizedSong);
            console.log('URL检查 - url:', song.url, 'link:', song.link, 'AudioURL:', song.AudioURL, 'AudioFullURL:', song.AudioFullURL);
            console.log('歌词URL:', normalizedSong.lyric_url);
            
            currentSong = normalizedSong;
            if (index >= 0) {
                currentIndex = index;
            }
            
            const player = document.getElementById('player');
            const audio = document.getElementById('audioPlayer');
            const title = document.getElementById('playerTitle');
            const artist = document.getElementById('playerArtist');

            console.log('正在播放:', normalizedSong.title, '-', normalizedSong.artist);
            console.log('最终音频URL:', normalizedSong.url);

            title.textContent = normalizedSong.title;
            artist.textContent = normalizedSong.artist;
            
            if (!normalizedSong.url) {
                console.error('URL为空！歌曲对象:', song);
                toast('音乐链接无效，这首歌可能没源了', 2600);
                return;
            }
            
            audio.src = normalizedSong.url;
            player.classList.add('active');

            audio.play().then(() => {
                reportNow(true);
            }).catch(e => {
                console.error('播放失败:', e);
                // 浏览器会拦「没有用户手势的自动播放」（分享链接打开就属于这种），
                // 用 toast 提示而不是 alert，弹窗在手机上会挡满屏
                const blocked = e && /interact|user gesture|NotAllowed/i.test(e.name + ' ' + e.message);
                toast(blocked ? '浏览器限制了自动播放，点一下 ▶️ 就能听' : '播放失败：' + e.message, 3000);
                // 没响起来就把状态标成「已暂停」，/status 上不会假装正在播
                reportNow(false);
            });

            // 加载歌词
            loadLyrics(song);

            // 记录播放意图（真正听到 20 秒才计入历史，见 maybeReportPlay）
            armHistoryReport(normalizedSong);

            // 队列落盘，刷新/关页面后还能接着听
            saveQueue();
        }

        // 歌词相关功能
        const LYRICS_OPEN_KEY = 'meow_lyrics_open';

        function escapeLyricHTML(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        function toggleLyrics(force) {
            const container = document.getElementById('lyricsContainer');
            const open = typeof force === 'boolean' ? force : !container.classList.contains('active');
            container.classList.toggle('active', open);
            try { localStorage.setItem(LYRICS_OPEN_KEY, open ? '1' : '0'); } catch (e) {}
            if (open) {
                const audio = document.getElementById('audioPlayer');
                if (audio) updateLyrics(audio.currentTime);
            }
        }

        // 播放器里的单行歌词（跟唱用）
        function setMiniLyric(text, trans, isHint) {
            const box = document.getElementById('playerLyrics');
            const t = document.getElementById('playerLyricText');
            const tr = document.getElementById('playerLyricTrans');
            if (!box || !t || !tr) return;
            box.classList.add('visible');
            box.classList.toggle('no-lyric', !!isHint);
            t.textContent = text || '';
            if (trans) {
                tr.textContent = trans;
                tr.style.display = 'block';
            } else {
                tr.textContent = '';
                tr.style.display = 'none';
            }
        }

        // 无歌词时的统一出口：给一个跳去 /lyrics 手动搜的链接
        function showNoLyrics(msg) {
            const box = document.getElementById('lyricsContent');
            lyricsData = [];
            currentLyricIndex = -1;

            const title = currentSong ? (currentSong.title || '') : '';
            const artist = currentSong ? (currentSong.artist || '') : '';
            let link = '';
            if (title) {
                link = '<br><a class="lyrics-empty-link" target="_blank" rel="noopener" href="/lyrics?song=' +
                    encodeURIComponent(title) + '&singer=' + encodeURIComponent(artist) +
                    '">去歌词页手动搜索 →</a>';
            }
            box.innerHTML = '<div class="no-lyrics">' + escapeLyricHTML(msg || '该歌曲暂无歌词') + link + '</div>';
            document.getElementById('lyricsToggle').classList.add('active');
            setMiniLyric('暂无歌词 · 点这里去搜索', '', true);
            updateLyricEditBtn();
